<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION – Explain</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .explain-wrap { max-width: 760px; }

    .ctx-bar {
      display: flex; flex-wrap: wrap; gap: var(--space-lg);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-lg); box-shadow: var(--shadow-sm);
    }
    .ctx-item { display: flex; flex-direction: column; gap: 2px; }
    .ctx-label { font-size: var(--font-size-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .ctx-val   { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text); }

    .aprov-block {
      background: var(--color-warning-bg); border: 1px solid #FCD34D;
      border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-lg); display: flex; align-items: flex-start; gap: var(--space-md);
    }
    .aprov-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
    .aprov-body { flex: 1; }
    .aprov-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--color-warning); margin-bottom: var(--space-sm); }
    .aprov-chain { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-xs); }
    .aprov-step {
      font-size: var(--font-size-xs); font-weight: 600; padding: 4px 12px;
      border-radius: 20px; border: 1px solid #FCD34D; color: var(--color-warning); background: transparent;
    }
    .aprov-step.active { background: var(--color-warning); color: #fff; border-color: var(--color-warning); }
    .aprov-sep { font-size: var(--font-size-xs); color: var(--color-warning); font-weight: 600; }

    .section-title {
      font-size: var(--font-size-xs); font-weight: 600; color: var(--color-text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: var(--space-sm); margin-top: var(--space-lg);
    }

    .cond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .cond-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-md); box-shadow: var(--shadow-sm); }
    .cond-card-label { font-size: var(--font-size-xs); color: var(--color-text-muted); font-weight: 500; margin-bottom: var(--space-xs); }
    .cond-card-val   { font-size: var(--font-size-lg); font-weight: 700; color: var(--color-primary); line-height: 1.1; }
    .cond-card-sub   { font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: 3px; }

    .doc-block { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: var(--space-md); }
    .doc-group-head { background: var(--color-bg); border-bottom: 1px solid var(--color-border); padding: 8px var(--space-md); font-size: var(--font-size-xs); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .doc-row { display: flex; align-items: center; gap: var(--space-sm); padding: 10px var(--space-md); border-bottom: 1px solid var(--color-border); }
    .doc-row:last-child { border-bottom: none; }
    .doc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-req  { background: var(--color-no-apto); }
    .dot-cond { background: var(--color-warning); }
    .doc-name { flex: 1; font-size: var(--font-size-sm); color: var(--color-text); }
    .doc-tag  { font-size: var(--font-size-xs); font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .dt-req   { background: var(--color-no-apto-bg); color: var(--color-no-apto); }
    .dt-cond  { background: var(--color-warning-bg); color: var(--color-warning); }
    .dt-pre   { background: var(--color-apto-bg);    color: var(--color-apto); }

    @media print {
      .sidebar, .topbar { display: none; }
      .main { margin-left: 0; }
      .content { padding: 0; }
    }
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">ORI<span>ON</span></div>
    <nav class="sidebar-nav">
      <span class="sidebar-label">Asesor</span>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="notifications.html">🔔 Notificaciones</a>
      <span class="sidebar-label">Evaluación</span>
      <a href="match.html">🎯 Match</a>
      <a href="verify.html">✅ Verify</a>
      <a href="explain.html" class="active">📋 Explain</a>
      <span class="sidebar-label">Cliente</span>
      <a href="index.html">➕ Nueva consulta</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Guía Operativa</span>
      <span class="topbar-phase">ORION Explain</span>
    </div>

    <div class="content">
      <div class="page-header">
        <div class="page-title">Guía para completar la operación</div>
        <div class="page-subtitle">Condiciones aplicables, documentación pendiente y nivel de aprobación</div>
      </div>

      <div class="explain-wrap" id="explain-content">
        <div class="empty">Cargando guía operativa...</div>
      </div>
    </div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/data.js"></script>
<script src="js/explain.js"></script>
</body>
</html>
