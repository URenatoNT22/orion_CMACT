<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ORION — WhatsApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-panel: #1d1f1f;
      --bg-hover: #2e2f2f;
      --bg-chat:  #161717;
      --bg-in:    #252626;
      --bg-out:   #144d37;
      --txt:      #e9edef;
      --txt-sub:  #aebac1;
      --txt-dim:  #8696a0;
      --green:    #21c063;
      --green-dk: #1aa657;
      --btn-txt:  #21c063;
      --quote:    #06cf9c;
      --err:      #f15c6d;
      --font: -apple-system,'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif;
    }

    html, body { height:100%; width:100%; overflow:hidden; background:#0a0a0a; font-family:var(--font); -webkit-font-smoothing:antialiased; }
    .ic { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block; }

    .phone-wrap { width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg-chat); position:relative; max-width:430px; margin:0 auto; overflow:hidden; }

    /* Status bar */
    .status-bar { height:28px; background:var(--bg-panel); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; z-index:20; }
    .sb-time-os { font-size:12px; font-weight:600; color:var(--txt); }
    .sb-icons-os { display:flex; align-items:center; gap:6px; color:var(--txt); }
    .sb-icons-os svg { height:12px; width:auto; fill:currentColor; }

    /* Header */
    .chat-header { background:var(--bg-panel); height:58px; padding:0 6px 0 4px; display:flex; align-items:center; gap:6px; flex-shrink:0; z-index:10; border-bottom:1px solid #2a2b2b; }
    .ch-back { width:36px; height:36px; border:none; background:transparent; color:var(--txt); display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .ch-back .ic { width:22px; height:22px; }
    .ch-av { width:38px; height:38px; border-radius:50%; background:#f9f8f8; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    .ch-av img { width:120%; height:90%; object-fit:contain; }
    .ch-info { flex:1; min-width:0; }
    .ch-name { color:var(--txt); font-size:15.5px; font-weight:500; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ch-status { color:var(--txt-dim); font-size:12px; }
    .icon-btn { width:38px; height:38px; border-radius:50%; border:none; background:transparent; color:var(--txt-sub); cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .icon-btn:active { background:var(--bg-hover); }

    .chat-bg { position:absolute; inset:0; background-image:url("wsp_fondo.png"); background-repeat:repeat; opacity:.1; pointer-events:none; z-index:0; }

    /* Mensajes */
    .messages { flex:1; overflow-y:auto; padding:10px 4% 8px; display:flex; flex-direction:column; gap:3px; position:relative; z-index:1; -webkit-overflow-scrolling:touch; }
    .messages::-webkit-scrollbar { display:none; }
    .date-div { display:flex; justify-content:center; margin:8px 0 5px; }
    .date-div span { background:#1a2428; color:var(--txt-sub); font-size:11.5px; padding:4px 10px; border-radius:8px; }
    .sys-note { display:flex; justify-content:center; margin:2px 0 8px; }
    .sys-note span { background:#1a2428; color:#d1b468; font-size:11.5px; padding:6px 10px; border-radius:8px; max-width:88%; text-align:center; line-height:1.4; }

    .msg-row { display:flex; animation:fadeUp .2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .msg-row.in  { justify-content:flex-start; }
    .msg-row.out { justify-content:flex-end; }

    .bubble { max-width:80%; border-radius:7.5px; font-size:14.2px; line-height:19.5px; color:var(--txt); position:relative; word-wrap:break-word; box-shadow:0 1px .5px rgba(0,0,0,.28); }
    .msg-row.in  .bubble { background:var(--bg-in); border-top-left-radius:0; }
    .msg-row.out .bubble { background:var(--bg-out); border-top-right-radius:0; }
    .msg-row.in .bubble::before { content:''; position:absolute; top:0; left:-7px; border-width:0 7px 7px 0; border-style:solid; border-color:transparent var(--bg-in) transparent transparent; }
    .msg-row.out .bubble::after { content:''; position:absolute; top:0; right:-7px; border-width:0 0 7px 7px; border-style:solid; border-color:transparent transparent transparent var(--bg-out); }
    .msg-row.in + .msg-row.in .bubble, .msg-row.out + .msg-row.out .bubble { border-radius:7.5px; }
    .msg-row.in + .msg-row.in .bubble::before, .msg-row.out + .msg-row.out .bubble::after { display:none; }
    .msg-row.in + .msg-row.in, .msg-row.out + .msg-row.out { margin-top:-1px; }
    .msg-row.in:not(.msg-row.in + .msg-row.in), .msg-row.out:not(.msg-row.out + .msg-row.out) { margin-top:6px; }

    .b-pad { padding:6px 8px 8px; }
    .b-text b { font-weight:700; }
    .b-text code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .msg-meta { float:right; display:flex; align-items:center; gap:3px; margin:6px 0 -5px 10px; }
    .msg-time { font-size:11px; color:var(--txt-dim); white-space:nowrap; }
    .msg-row.out .msg-time { color:#8fb5a5; }
    .ticks svg { width:16px; height:11px; display:block; }

    /* Cita (respuesta a un mensaje interactivo) */
    .quote { background:rgba(0,0,0,.2); border-left:4px solid var(--quote); border-radius:6px; padding:5px 8px 6px; margin:3px 3px 4px; }
    .quote-n { color:var(--quote); font-size:12.5px; font-weight:600; line-height:1.3; }
    .quote-t { color:#c2d3cb; font-size:12.5px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
    .bubble.has-quote { min-width:200px; }

    /* Mensaje interactivo (header / body / footer + botones) */
    .bubble.ia { width:82%; max-width:330px; }
    .ia-hd { font-weight:700; font-size:15px; line-height:20px; margin-bottom:3px; }
    .ia-ft { font-size:12.5px; color:var(--txt-dim); margin-top:4px; line-height:17px; }
    .ia-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:7px; border:none; background:none; border-top:1px solid #3b3d3d; color:var(--btn-txt); font-family:var(--font); font-size:14.5px; font-weight:500; padding:11px 8px; cursor:pointer; }
    .ia-btn:active { background:rgba(255,255,255,.05); }
    .ia-btn:last-child { border-radius:0 0 7.5px 7.5px; }
    .ia-btn .ic { width:17px; height:17px; }

    /* Imagen */
    .bubble.img { width:82%; max-width:330px; padding:3px; }
    .bubble.img img { width:100%; display:block; border-radius:6px; cursor:zoom-in; }
    .img-cap { padding:6px 5px 6px; }

    /* Typing */
    .typing-row { display:flex; margin-top:6px; }
    .typing-bub { background:var(--bg-in); border-radius:7.5px; border-top-left-radius:0; padding:11px 14px; display:flex; gap:4px; position:relative; }
    .typing-bub::before { content:''; position:absolute; top:0; left:-7px; border-width:0 7px 7px 0; border-style:solid; border-color:transparent var(--bg-in) transparent transparent; }
    .t-dot { width:7px; height:7px; background:var(--txt-dim); border-radius:50%; animation:bounce 1.3s infinite; }
    .t-dot:nth-child(2){animation-delay:.15s} .t-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

    /* Input bar */
    .input-bar { background:var(--bg-panel); min-height:58px; padding:8px; display:flex; align-items:center; gap:6px; flex-shrink:0; z-index:10; border-top:1px solid #2a2b2b; }
    .ib-box { flex:1; display:flex; align-items:center; background:var(--bg-hover); border-radius:22px; padding:0 4px; min-height:44px; }
    .ib-box .icon-btn { width:34px; height:34px; color:var(--txt-dim); }
    .ib-input { flex:1; min-width:0; background:transparent; border:none; padding:9px 4px; color:var(--txt); font-size:15px; font-family:var(--font); outline:none; }
    .ib-input::placeholder { color:var(--txt-dim); }
    .ib-send { width:46px; height:46px; border-radius:50%; background:var(--green); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#0d2216; }
    .ib-send:active { background:var(--green-dk); }
    .home-indicator { height:20px; background:var(--bg-panel); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .home-bar { width:120px; height:4px; background:#464747; border-radius:2px; }

    /* Hoja de lista (List message) */
    .overlay { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; flex-direction:column; justify-content:flex-end; animation:fade .18s ease; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    @keyframes up { from{transform:translateY(100%)} to{transform:none} }
    .sheet { background:#1d1f1f; border-radius:18px 18px 0 0; max-height:82%; display:flex; flex-direction:column; animation:up .25s cubic-bezier(.2,.8,.2,1); }
    .grab { width:36px; height:4px; background:#4a4c4c; border-radius:2px; margin:8px auto 0; }
    .sheet-hd { display:flex; align-items:center; padding:8px 8px 10px; }
    .sheet-t { flex:1; text-align:center; font-size:16px; font-weight:600; color:var(--txt); margin-right:38px; }
    .sheet-body { overflow-y:auto; padding-bottom:6px; }
    .sec-h { color:var(--txt-dim); font-size:13.5px; padding:10px 22px 6px; }
    .row { display:flex; align-items:center; gap:14px; padding:11px 22px; cursor:pointer; }
    .row:active { background:#262828; }
    .row-tx { flex:1; min-width:0; }
    .row-t { font-size:15.5px; color:var(--txt); line-height:1.3; }
    .row-d { font-size:13px; color:var(--txt-dim); line-height:1.35; margin-top:1px; }
    .radio { width:21px; height:21px; border-radius:50%; border:2px solid #8696a0; flex-shrink:0; transition:all .15s; }
    .row.sel .radio { border-color:var(--green); background:var(--green); box-shadow:inset 0 0 0 4px #1d1f1f; }
    .sheet-ft { display:flex; justify-content:flex-end; padding:8px 18px 18px; }
    .fab { width:54px; height:54px; border-radius:50%; background:var(--green); border:none; color:#0d2216; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity .15s; }
    .fab:disabled { opacity:.35; cursor:default; }

    /* Pantalla de formulario (WhatsApp Flow) */
    .flow { position:absolute; inset:28px 0 0 0; z-index:60; background:var(--bg-chat); display:flex; flex-direction:column; animation:up .28s cubic-bezier(.2,.8,.2,1); }
    .flow-top { height:56px; display:flex; align-items:center; gap:6px; padding:0 6px; border-bottom:1px solid #2a2b2b; background:var(--bg-panel); flex-shrink:0; }
    .flow-title { flex:1; font-size:17px; font-weight:600; color:var(--txt); }
    .flow-body { flex:1; overflow-y:auto; padding:22px 18px; }
    .f-h { font-size:21px; font-weight:700; color:var(--txt); margin-bottom:6px; line-height:1.25; }
    .f-p { font-size:14.5px; color:var(--txt-sub); margin-bottom:26px; line-height:1.45; }
    .f-in { position:relative; margin-bottom:22px; }
    .f-in input { width:100%; background:transparent; border:1px solid #5d6266; border-radius:8px; padding:15px 14px; color:var(--txt); font-size:16px; outline:none; font-family:var(--font); -webkit-appearance:none; }
    .f-in input::-webkit-outer-spin-button, .f-in input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .f-in input[type=number] { -moz-appearance:textfield; }
    .f-in label { position:absolute; left:10px; top:-8px; background:var(--bg-chat); padding:0 5px; font-size:12px; color:var(--txt-sub); }
    .f-in input:focus { border-color:var(--green); border-width:2px; padding:14px 13px; }
    .f-in input:focus + label { color:var(--green); }
    .f-help { font-size:12px; color:var(--txt-dim); margin:6px 4px 0; }
    .f-in.err input { border-color:var(--err); }
    .f-in.err label, .f-in.err .f-help { color:var(--err); }
    .flow-ft { padding:12px 16px 16px; border-top:1px solid #2a2b2b; flex-shrink:0; }
    .f-btn { width:100%; background:var(--green); color:#0d2216; border:none; border-radius:24px; padding:13px; font-size:15px; font-weight:600; font-family:var(--font); cursor:pointer; }
    .f-btn:active { background:var(--green-dk); }
    .f-mg { text-align:center; font-size:12px; color:var(--txt-dim); margin-top:10px; }
    .f-mg span { color:var(--green); }

    /* Visor de imagen */
    .lightbox { position:absolute; inset:0; z-index:70; background:#000; display:flex; flex-direction:column; animation:fade .15s; }
    .lb-top { height:56px; display:flex; align-items:center; padding:0 6px; color:var(--txt); }
    .lb-img { flex:1; display:flex; align-items:center; justify-content:center; padding:10px; }
    .lb-img img { max-width:100%; max-height:100%; }
  </style>
</head>
<body>

<div class="phone-wrap" id="phone">

  <div class="status-bar">
    <span class="sb-time-os" id="os-time">9:41</span>
    <div class="sb-icons-os">
      <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" y="0" width="3" height="12" rx=".6"/></svg>
      <svg viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.6 10.6 0 0 0 8 .4C5.2.4 2.5 1.5.5 3.4l1.2 1.3A9 9 0 0 1 8 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3A7.2 7.2 0 0 0 8 4c-1.8 0-3.6.7-4.9 1.9l1.2 1.3c1-.9 2.3-1.4 3.7-1.4zM8 9.3c-.6 0-1.2.2-1.6.6L8 11.6l1.6-1.7c-.4-.4-1-.6-1.6-.6z"/></svg>
      <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.8"/><rect x="23.5" y="4" width="2" height="4" rx="1" opacity=".45"/></svg>
    </div>
  </div>

  <div class="chat-header">
    <button class="ch-back" aria-label="Volver"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="ch-av"><img src="Logo.png" alt="ORION"></div>
    <div class="ch-info">
      <div class="ch-name">ORION Agente</div>
      <div class="ch-status" id="ch-status">en línea</div>
    </div>
    <button class="icon-btn" aria-label="Llamar"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    <button class="icon-btn" aria-label="Más"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </div>

  <div class="chat-bg"></div>

  <div class="messages" id="messages">
    <div class="date-div"><span>Hoy</span></div>
    <div class="sys-note"><span>Esta cuenta de empresa usa un servicio seguro de Meta para gestionar este chat.</span></div>
  </div>

  <div class="input-bar">
    <div class="ib-box">
      <button class="icon-btn" aria-label="Emoji"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>
      <input class="ib-input" id="msg-input" type="text" placeholder="Mensaje" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="icon-btn" aria-label="Adjuntar"><svg class="ic" viewBox="0 0 24 24"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
    </div>
    <button class="ib-send" onclick="sendMsg()" aria-label="Enviar"><svg class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
  </div>

  <div class="home-indicator"><div class="home-bar"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  LÍMITES OFICIALES DE WHATSAPP (Cloud API)
//  Cada mensaje se valida contra estos valores antes de mostrarse.
//  Si algo se pasa, aparece un aviso en la consola del navegador.
// ═══════════════════════════════════════════════════════════════════════════
const LIMITS = {
  text:        4096,  // mensaje de texto
  header:      60,    // header de texto en mensajes interactivos
  footer:      60,
  btnBody:     1024,  // body de mensaje con botones
  btnCount:    3,     // máximo de botones de respuesta
  btnTitle:    20,
  listBody:    4096,
  listButton:  20,
  listRows:    10,    // total de filas en todas las secciones
  rowTitle:    24,
  rowDesc:     72,
  sectionTitle:24,
  flowCta:     20,
  flowLabel:   20,    // label de TextInput en Flows
  flowHelper:  80,
  flowFooter:  35,
  caption:     1024,
};
const WARN = [];
function check(cond, msg) { if (!cond) { WARN.push(msg); console.warn('[Límite WhatsApp] ' + msg); } }

// ═══════════════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN DEL DEMO
// ═══════════════════════════════════════════════════════════════════════════
const CFG = {
  clients: {
    '12345678': { name: 'Carlos Mendoza',  status: 'Recurrente' },
    '87654321': { name: 'Ana Ríos Torres', status: 'Nuevo' },
  },
  segmento: 'AA',
  checkRules: [
    ['Segmento',                                   () => `*${CFG.segmento}*`],
    ['Lista negativa',                             () => 'No registra'],
    ['Calificación RCC actual',                    () => 'Normal'],
    ['Deficiente, Dudoso y Pérdida (últ. 6 m)',    () => 'Sin registros'],
    ['Castigado, judicial o venta (últ. 24 m)',    () => 'Sin registros'],
  ],
  fuentes:  ['Dependiente', 'Independiente', 'Negocio propio'],
  destinos: ['Activo fijo', 'Capital de trabajo', 'Consumo'],
  products: [
    { id: 'disfruta', t: 'Disfruta +',        d: 'Crédito de consumo',              ok: false },
    { id: 'emprende', t: 'Emprende +',        d: 'Crédito emprendedor',             ok: false },
    { id: 'micro',    t: 'Microemprendedor',  d: 'Pequeña empresa · capital de trabajo', ok: true },
    { id: 'negocios', t: '+ Negocios',        d: 'Crédito empresarial',             ok: true },
    { id: 'crediagil',t: 'Campaña Crediagil', d: 'Campaña vigente',                 ok: true },
    { id: 'navidena', t: 'Campaña Navideña',  d: 'Campaña de temporada',            ok: true },
  ],
  verify: { entidades: '2', calificacion: 'Normal', saldoPagado: '60%' },
  ratio: {
    cols: ['AAA', 'AA', 'A', 'B', 'C'],
    rows: [
      ['Hasta S/ 2,000',       ['≤ 80%', '≤ 80%', '≤ 70%', '≤ 60%', '≤ 60%']],
      ['S/ 2,000 – 10,000',    ['≤ 85%', '≤ 85%', '≤ 80%', '≤ 70%', '≤ 65%']],
      ['Más de S/ 10,000',     ['≤ 90%', '≤ 90%', '≤ 80%', '≤ 75%', '≤ 70%']],
    ],
  },
  explain: [
    ['🛡️', 'Nivel de aprobación',   '*Líder*'],
    ['📄', 'Documento del negocio', 'Declaración jurada'],
    ['🏛️', 'Garantía',              'Patrimonio personal'],
    ['📈', 'TEA mínima',            '*45%*'],
    ['⚠️', 'Excepciones',           'No aplica'],
    ['👥', 'Requiere cónyuge',      '*Sí*'],
  ],
};

// ═══════════════════════════════════════════════════════════════════════════
//  UTILIDADES
// ═══════════════════════════════════════════════════════════════════════════
const $box    = document.getElementById('messages');
const $status = document.getElementById('ch-status');
const $phone  = document.getElementById('phone');
const sleep   = ms => new Promise(r => setTimeout(r, ms));
const hhmm    = () => new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
const fmtN    = n => Number(n).toLocaleString('es-PE');
const scroll  = () => { $box.scrollTop = $box.scrollHeight; };
const esc     = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

(function clock(){ document.getElementById('os-time').textContent = hhmm(); setTimeout(clock, 10000); })();

// Formato nativo de WhatsApp: *negrita*, _cursiva_, ~tachado~, `código`
function wa(text) {
  return esc(text)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,:;!?])/gm, '$1<i>$2</i>')
    .replace(/~([^~\n]+)~/g, '<s>$1</s>')
    .replace(/\n/g, '<br>');
}
const plain = s => String(s).replace(/[*_~`]/g, '');

const TICKS = `<svg viewBox="0 0 16 11"><path fill="#53bdeb" d="M11.07.65a.75.75 0 0 1 .03 1.06l-6 6.5a.75.75 0 0 1-1.1 0L1.45 5.47a.75.75 0 1 1 1.1-1.02l2 2.15 5.46-5.92a.75.75 0 0 1 1.06-.03zm3.5 0a.75.75 0 0 1 .03 1.06l-6 6.5a.75.75 0 0 1-1.07.03l-.5-.47a.75.75 0 1 1 1.03-1.09l-.05.04 5.5-5.97a.75.75 0 0 1 1.06-.1z"/></svg>`;
const meta = dir => `<span class="msg-meta"><span class="msg-time">${hhmm()}</span>${dir === 'out' ? `<span class="ticks">${TICKS}</span>` : ''}</span>`;
const SVG = {
  reply: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  list:  '<svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  form:  '<svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
  close: '<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  send:  '<svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>',
  dots:  '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
};

function row(dir, cls, inner) {
  const r = document.createElement('div');
  r.className = `msg-row ${dir}`;
  r.innerHTML = `<div class="bubble ${cls}">${inner}</div>`;
  $box.appendChild(r); scroll();
  return r;
}

async function typing(ms = 1100) {
  const r = document.createElement('div');
  r.className = 'typing-row';
  r.innerHTML = `<div class="typing-bub"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>`;
  $box.appendChild(r); scroll();
  $status.textContent = 'escribiendo…';
  await sleep(ms);
  r.remove();
  $status.textContent = 'en línea';
}

// ═══════════════════════════════════════════════════════════════════════════
//  TIPOS DE MENSAJE DE WHATSAPP
// ═══════════════════════════════════════════════════════════════════════════
let seq = 0, active = null;
const REG = {};

const WA = {
  // Mensaje de texto
  text(body) {
    check(body.length <= LIMITS.text, `Texto supera ${LIMITS.text} caracteres`);
    row('in', '', `<div class="b-pad b-text">${wa(body)}${meta('in')}</div>`);
  },

  // Imagen con pie
  image(src, caption) {
    check(!caption || caption.length <= LIMITS.caption, 'Caption de imagen muy largo');
    const r = row('in', 'img', `<img src="${src}" alt="">${caption ? `<div class="img-cap b-text">${wa(caption)}${meta('in')}</div>` : ''}`);
    r.querySelector('img').onclick = () => openLightbox(src);
  },

  // Botones de respuesta (máx. 3)
  buttons({ header, body, footer, buttons }, onReply) {
    check(buttons.length <= LIMITS.btnCount, `Más de ${LIMITS.btnCount} botones`);
    buttons.forEach(b => check(b.title.length <= LIMITS.btnTitle, `Botón "${b.title}" supera ${LIMITS.btnTitle} caracteres`));
    check(body.length <= LIMITS.btnBody, 'Body de botones supera 1024');
    check(!header || header.length <= LIMITS.header, `Header "${header}" supera 60`);
    check(!footer || footer.length <= LIMITS.footer, `Footer "${footer}" supera 60`);
    const id = 'm' + (++seq);
    REG[id] = { header, body, onReply, buttons };
    active = id;
    row('in', 'ia', `
      <div class="b-pad b-text">
        ${header ? `<div class="ia-hd">${esc(header)}</div>` : ''}
        <div>${wa(body)}</div>
        ${footer ? `<div class="ia-ft">${esc(footer)}</div>` : ''}
        ${meta('in')}
      </div>
      ${buttons.map(b => `<button class="ia-btn" onclick="tapButton('${id}','${b.id}')">${SVG.reply}${esc(b.title)}</button>`).join('')}
    `);
    return id;
  },

  // Mensaje de lista (un botón que abre las opciones)
  list({ header, body, footer, button, sections }, onReply) {
    const total = sections.reduce((n, s) => n + s.rows.length, 0);
    check(total <= LIMITS.listRows, `Lista con ${total} filas (máx. 10)`);
    check(button.length <= LIMITS.listButton, `Botón de lista "${button}" supera 20`);
    check(body.length <= LIMITS.listBody, 'Body de lista muy largo');
    check(!header || header.length <= LIMITS.header, 'Header de lista supera 60');
    check(!footer || footer.length <= LIMITS.footer, 'Footer de lista supera 60');
    sections.forEach(s => {
      check(!s.title || s.title.length <= LIMITS.sectionTitle, `Sección "${s.title}" supera 24`);
      s.rows.forEach(r => {
        check(r.title.length <= LIMITS.rowTitle, `Fila "${r.title}" supera 24`);
        check(!r.description || r.description.length <= LIMITS.rowDesc, `Descripción de "${r.title}" supera 72`);
      });
    });
    const id = 'm' + (++seq);
    REG[id] = { header, body, onReply, sections, button };
    active = id;
    row('in', 'ia', `
      <div class="b-pad b-text">
        ${header ? `<div class="ia-hd">${esc(header)}</div>` : ''}
        <div>${wa(body)}</div>
        ${footer ? `<div class="ia-ft">${esc(footer)}</div>` : ''}
        ${meta('in')}
      </div>
      <button class="ia-btn" onclick="openList('${id}')">${SVG.list}${esc(button)}</button>
    `);
    return id;
  },

  // WhatsApp Flow (formulario nativo a pantalla completa)
  flow({ header, body, footer, cta, screen }, onSubmit) {
    check(cta.length <= LIMITS.flowCta, `CTA "${cta}" supera 20`);
    check(screen.footer.length <= LIMITS.flowFooter, 'Botón del Flow supera 35');
    screen.inputs.forEach(i => {
      check(i.label.length <= LIMITS.flowLabel, `Label "${i.label}" supera 20`);
      check(!i.helper || i.helper.length <= LIMITS.flowHelper, `Helper de "${i.label}" supera 80`);
    });
    const id = 'm' + (++seq);
    REG[id] = { header, body, onReply: onSubmit, screen };
    active = id;
    row('in', 'ia', `
      <div class="b-pad b-text">
        ${header ? `<div class="ia-hd">${esc(header)}</div>` : ''}
        <div>${wa(body)}</div>
        ${footer ? `<div class="ia-ft">${esc(footer)}</div>` : ''}
        ${meta('in')}
      </div>
      <button class="ia-btn" onclick="openFlow('${id}')">${SVG.form}${esc(cta)}</button>
    `);
    return id;
  },
};

// Respuesta del asesor (con cita al mensaje respondido, como en WhatsApp)
function outReply(mid, text) {
  const m = REG[mid];
  const q = m ? (m.header || plain(m.body).split('\n')[0]) : '';
  row('out', q ? 'has-quote' : '', `
    ${q ? `<div class="quote"><div class="quote-n">ORION Agente</div><div class="quote-t">${esc(q)}</div></div>` : ''}
    <div class="b-pad b-text" style="padding-top:${q ? 0 : 6}px">${wa(text)}${meta('out')}</div>
  `);
}
function outText(text) {
  row('out', '', `<div class="b-pad b-text">${wa(text)}${meta('out')}</div>`);
}

// En WhatsApp los botones antiguos siguen visibles: el bot debe ignorarlos
async function stale(mid, label) {
  outReply(mid, label);
  await typing(700);
  WA.text('Esa opción corresponde a un paso anterior. Continúa desde el último mensaje 👇');
}

async function tapButton(mid, bid) {
  const m = REG[mid];
  const b = m.buttons.find(x => x.id === bid);
  if (mid !== active) return stale(mid, b.title);
  active = null;
  outReply(mid, b.title);
  m.onReply(bid);
}

// ── Hoja de lista ──────────────────────────────────────────────────────────
function openList(mid) {
  const m = REG[mid];
  let selected = null;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-hd">
        <button class="icon-btn js-x">${SVG.close}</button>
        <div class="sheet-t">${esc(m.button)}</div>
      </div>
      <div class="sheet-body">
        ${m.sections.map(s => `
          ${s.title ? `<div class="sec-h">${esc(s.title)}</div>` : ''}
          ${s.rows.map(r => `
            <div class="row" data-id="${r.id}">
              <div class="row-tx"><div class="row-t">${esc(r.title)}</div>${r.description ? `<div class="row-d">${esc(r.description)}</div>` : ''}</div>
              <span class="radio"></span>
            </div>`).join('')}
        `).join('')}
      </div>
      <div class="sheet-ft"><button class="fab js-send" disabled>${SVG.send}</button></div>
    </div>`;
  $phone.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('.js-x').onclick = close;
  ov.querySelectorAll('.row').forEach(r => r.onclick = () => {
    ov.querySelectorAll('.row').forEach(x => x.classList.remove('sel'));
    r.classList.add('sel');
    selected = r.dataset.id;
    ov.querySelector('.js-send').disabled = false;
  });
  ov.querySelector('.js-send').onclick = () => {
    const rowData = m.sections.flatMap(s => s.rows).find(r => r.id === selected);
    close();
    if (mid !== active) return stale(mid, rowData.title);
    active = null;
    outReply(mid, rowData.title);
    m.onReply(selected);
  };
}

// ── Pantalla del Flow ──────────────────────────────────────────────────────
function openFlow(mid) {
  const m = REG[mid];
  const s = m.screen;
  const fl = document.createElement('div');
  fl.className = 'flow';
  fl.innerHTML = `
    <div class="flow-top">
      <button class="icon-btn js-x">${SVG.close}</button>
      <div class="flow-title">${esc(s.title)}</div>
      <button class="icon-btn">${SVG.dots}</button>
    </div>
    <div class="flow-body">
      ${s.heading ? `<div class="f-h">${esc(s.heading)}</div>` : ''}
      ${s.text ? `<div class="f-p">${esc(s.text)}</div>` : ''}
      ${s.inputs.map(i => `
        <div class="f-in" data-name="${i.name}">
          <input type="${i.type || 'text'}" inputmode="${i.type === 'number' ? 'decimal' : 'text'}">
          <label>${esc(i.label)}${i.required ? '' : ' (opcional)'}</label>
          ${i.helper ? `<div class="f-help" data-h="${esc(i.helper)}">${esc(i.helper)}</div>` : ''}
        </div>`).join('')}
    </div>
    <div class="flow-ft">
      <button class="f-btn js-ok">${esc(s.footer)}</button>
      <div class="f-mg">Gestionado por Caja Trujillo. <span>Más información</span></div>
    </div>`;
  $phone.appendChild(fl);
  const first = fl.querySelector('input'); if (first) setTimeout(() => first.focus(), 300);
  fl.querySelector('.js-x').onclick = () => fl.remove();
  fl.querySelectorAll('.f-in input').forEach(inp => inp.oninput = () => {
    const w = inp.closest('.f-in'); w.classList.remove('err');
    const h = w.querySelector('.f-help'); if (h) h.textContent = h.dataset.h;
  });
  fl.querySelector('.js-ok').onclick = () => {
    const data = {}; let ok = true;
    s.inputs.forEach(i => {
      const w = fl.querySelector(`.f-in[data-name="${i.name}"]`);
      const v = w.querySelector('input').value.trim();
      const bad = i.required && (v === '' || (i.type === 'number' && !(parseFloat(v) >= (i.min ?? 0))));
      if (bad) {
        ok = false; w.classList.add('err');
        const h = w.querySelector('.f-help'); if (h) h.textContent = 'Campo obligatorio';
      }
      data[i.name] = v;
    });
    if (!ok) return;
    fl.remove();
    if (mid !== active) return stale(mid, 'Formulario enviado');
    active = null;
    m.onReply(data);
  };
}

// ── Visor de imagen ────────────────────────────────────────────────────────
function openLightbox(src) {

  lb.innerHTML = `<div class="lb-top"><button class="icon-btn">${SVG.close}</button></div><div class="lb-img"><img src="${src}"></div>`;

}

// ═══════════════════════════════════════════════════════════════════════════
//  IMAGEN DE LA TABLA (en producción la genera el backend y se envía como PNG)
// ═══════════════════════════════════════════════════════════════════════════
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function ratioImage(seg) {
  const W = 1000, P = 48, F = '"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const headH = 72, rowH = 84, tableY = 196;
  const H = tableY + headH + rowH * CFG.ratio.rows.length + 110;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const segIdx = CFG.ratio.cols.indexOf(seg);

  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#CC0000'; x.fillRect(0, 0, W, 12);

  x.fillStyle = '#CC0000'; x.font = `700 22px ${F}`; x.fillText('LINEAMIENTO POR SEGMENTO', P, 66);
  x.fillStyle = '#1A1A1A'; x.font = `700 40px ${F}`; x.fillText('Ratio de cuota límite', P, 114);
  x.fillStyle = '#6B6B6B'; x.font = `400 25px ${F}`; x.fillText('En función al ingreso neto · Pequeña empresa', P, 152);

  // Pill segmento
  x.font = `700 24px ${F}`;
  const pt = `Segmento ${seg}`, pw = x.measureText(pt).width + 44;
  rr(x, W - P - pw, 84, pw, 48, 24); x.fillStyle = '#E8F5EE'; x.fill();
  x.fillStyle = '#1B7A4A'; x.fillText(pt, W - P - pw + 22, 116);

  // Tabla
  const tw = W - P * 2, c0 = 330, cw = (tw - c0) / CFG.ratio.cols.length;
  const th = headH + rowH * CFG.ratio.rows.length;
  x.save(); rr(x, P, tableY, tw, th, 14); x.clip();
  x.fillStyle = '#F4F5F6'; x.fillRect(P, tableY, tw, headH);
  if (segIdx >= 0) {
    x.fillStyle = '#E8F5EE'; x.fillRect(P + c0 + cw * segIdx, tableY, cw, th);
    x.fillStyle = '#1B7A4A'; x.fillRect(P + c0 + cw * segIdx, tableY, cw, headH);
  }
  x.restore();

  x.strokeStyle = '#E3E5E8'; x.lineWidth = 2;
  for (let i = 1; i <= CFG.ratio.rows.length; i++) {
    const yy = tableY + headH + rowH * (i - 1);
    x.beginPath(); x.moveTo(P, yy); x.lineTo(P + tw, yy); x.stroke();
  }
  rr(x, P, tableY, tw, th, 14); x.stroke();

  x.textBaseline = 'middle';
  x.font = `600 21px ${F}`; x.fillStyle = '#6B6B6B';
  x.fillText('INGRESO NETO', P + 26, tableY + headH / 2);
  CFG.ratio.cols.forEach((col, i) => {
    x.font = `700 26px ${F}`; x.textAlign = 'center';
    x.fillStyle = i === segIdx ? '#FFFFFF' : '#1A1A1A';
    x.fillText(col, P + c0 + cw * i + cw / 2, tableY + headH / 2);
  });
  CFG.ratio.rows.forEach(([label, vals], r) => {
    const cy = tableY + headH + rowH * r + rowH / 2;
    x.textAlign = 'left'; x.font = `500 25px ${F}`; x.fillStyle = '#333333';
    x.fillText(label, P + 26, cy);
    vals.forEach((v, i) => {
      x.textAlign = 'center';
      x.font = i === segIdx ? `700 27px ${F}` : `400 25px ${F}`;
      x.fillStyle = i === segIdx ? '#1B7A4A' : '#555555';
      x.fillText(v, P + c0 + cw * i + cw / 2, cy);
    });
  });

  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillStyle = '#1B7A4A'; x.font = `600 21px ${F}`;
  x.fillText('■', P, H - 44);
  x.fillStyle = '#7A7A7A'; x.font = `400 21px ${F}`;
  x.fillText(`Columna aplicable al cliente (segmento ${seg})`, P + 26, H - 44);
  x.textAlign = 'right'; x.fillStyle = '#9E9E9E';
  x.fillText('ORION · Caja Trujillo', W - P, H - 44);
  return c.toDataURL('image/png');
}

//  FLUJO ORION
// ═══════════════════════════════════════════════════════════════════════════
let F = {};
const reset = () => { F = { step: 'idle', dni: '', client: null, fuente: '', destino: '', product: null, amount: 0, years: 0 }; };
reset();

async function menu(first = false) {
  reset();
  await typing(first ? 900 : 700);
  WA.buttons({
    header: 'ORION · Caja Trujillo',
    body: (first ? 'Hola 👋 Soy el *Agente ORION*.\n\n' : '') +
          'Te ayudo a *precalificar a un cliente* con su documento de identidad y te acompaño hasta la guía operativa.',
    footer: 'Asistente de evaluación crediticia',

}

async function help() {
  await typing(900);
  WA.buttons({
    header: '¿Cómo funciona?',
    body: 'La evaluación tiene *4 pasos*:\n\n' +
          '*1. Check* — precalificación por DNI\n' +

}

// ── 1-2. Documento ─────────────────────────────────────────────────────────
async function askDocType() {
  await typing(800);
  WA.buttons({
    header: 'Paso 1 de 4 · Check',
    body: 'Selecciona el *tipo de documento* del cliente.',
    footer: 'ORION Check',
    buttons: [{ id: 'DNI', title: 'DNI' }],
  }, () => askDni());
}

async function askDni() {
  await typing(700);
  WA.text('Escribe el *número de DNI* del cliente (8 dígitos).');
  F.step = 'dni';
}

// ── 3. ORION CHECK ─────────────────────────────────────────────────────────
async function runCheck(dni) {
  F.step = 'check';
  F.dni = dni;
  F.client = CFG.clients[dni] || { name: `Cliente ${dni}`, status: 'Nuevo' };
  await typing(1700);
  WA.text(
    `*ORION Check* · Precalificación\n\n` +
    `👤 *${F.client.name}*\n` +
    `DNI ${dni} · Cliente ${F.client.status.toLowerCase()}\n\n` +
    CFG.checkRules.map(([l, v]) => `✅ ${l}: ${v()}`).join('\n') +
    `\n\n🟢 *Resultado: APTO*`
  );
  await typing(1000);
  WA.buttons({
    header: 'Fuente de ingreso',
    body: '¿Cuál es la *fuente de ingreso* del cliente?',
    footer: 'Paso 1 de 4 · Check',
    buttons: CFG.fuentes.map(f => ({ id: f, title: f })),
  }, async f => {
    F.fuente = f;
    await typing(800);
    WA.buttons({
      header: 'Destino del crédito',
      body: '¿Cuál es el *destino* del crédito?',
      footer: 'Paso 1 de 4 · Check',
      buttons: CFG.destinos.map(d => ({ id: d, title: d })),
    }, d => { F.destino = d; doMatch(); });
  });
}

// ── 4. ORION MATCH ─────────────────────────────────────────────────────────
async function doMatch() {
  await typing(1500);
  const ok = CFG.products.filter(p => p.ok);
  const no = CFG.products.filter(p => !p.ok);
  WA.list({
    header: 'Paso 2 de 4 · Match',
    body: `Productos evaluados para *${F.client.name}*\n_${F.fuente} · ${F.destino}_\n\n` +
          ok.map(p => `✅ ${p.t}`).join('\n') + '\n' +
          no.map(p => `❌ ${p.t}`).join('\n') +
          `\n\nToca *Ver productos* y elige uno apto para continuar.`,
    footer: `ORION Match · ${ok.length} aptos de ${CFG.products.length}`,
    button: 'Ver productos',
    sections: [{ title: 'Productos aptos', rows: ok.map(p => ({ id: p.id, title: p.t, description: p.d })) }],
  }, id => { F.product = CFG.products.find(p => p.id === id); askData(); });
}

// ── 5. Datos de la operación (WhatsApp Flow) ───────────────────────────────
async function askData() {
  await typing(900);
  WA.flow({
    header: 'Paso 3 de 4 · Verify',
    body: `Producto seleccionado: *${F.product.t}*\n\nCompleta el monto y la antigüedad del negocio para evaluar las condiciones.`,
    footer: 'ORION Verify',
    cta: 'Ingresar datos',
    screen: {
      title: 'Datos de la operación',
      heading: F.product.t,
      text: 'Ingresa el monto solicitado y el tiempo de funcionamiento del negocio.',
      inputs: [
        { name: 'amount', label: 'Monto (S/)',        type: 'number', required: true, min: 1, helper: 'Ejemplo: 8000' },
        { name: 'years',  label: 'Antigüedad (años)', type: 'number', required: true, min: 0, helper: 'Tiempo de funcionamiento del negocio' },
      ],
      footer: 'Evaluar condiciones',
    },
  }, data => verify(data));
}

// ── 6. ORION VERIFY ────────────────────────────────────────────────────────
async function verify(data) {
  F.amount = parseFloat(data.amount);
  F.years  = parseFloat(data.years);
  outReply(Object.keys(REG).pop(), `📋 *Datos de la operación*\nMonto: S/ ${fmtN(F.amount)}\nAntigüedad: ${fmtN(F.years)} año(s)`);
  await typing(1700);
  const v = CFG.verify;
  WA.buttons({
    header: 'Paso 3 de 4 · Verify',
    body: `*${F.product.t}* — condiciones del producto\n\n` +
          `✅ Segmento: *${CFG.segmento}*\n` +
          `✅ Número de entidades: ${v.entidades}\n` +
          `✅ Calificación actual: ${v.calificacion}\n` +
          `✅ Monto: S/ ${fmtN(F.amount)}\n` +
          `✅ Antigüedad del negocio: ${fmtN(F.years)} año(s)\n` +
          `✅ % Saldo pagado: ${v.saldoPagado}\n\n` +
          `🟢 *Resultado: APTO*`,
    footer: 'ORION Verify',
    buttons: [{ id: 'explain', title: 'Ver guía operativa' }],
  }, () => explain());
}

// ── 7. ORION EXPLAIN ───────────────────────────────────────────────────────
async function explain() {
  await typing(1300);
  WA.image(ratioImage(CFG.segmento),
    `*Ratio de cuota límite* — Pequeña empresa\nSegmento del cliente: *${CFG.segmento}* (columna resaltada)`);
  await typing(1100);
  WA.buttons({
    header: 'Paso 4 de 4 · Explain',
    body: `*Guía operativa*\n${F.product.t} · S/ ${fmtN(F.amount)} · ${fmtN(F.years)} año(s)\n\n` +
          `🏷️ Segmento: *${CFG.segmento}*\n` +
          CFG.explain.map(([e, l, v]) => `${e} ${l}: ${v}`).join('\n'),
    footer: `ORION Explain · ${F.client.name}`,
    buttons: [{ id: 'fin', title: 'Finalizar' }, { id: 'new', title: 'Nueva consulta' }],
  }, id => id === 'fin' ? finish() : askDocType());
}

async function finish() {
  await typing(700);
  WA.buttons({
    body: `✅ Evaluación de *${F.client.name}* registrada.\n\nPuedes atender al siguiente cliente.`,
    footer: 'ORION · Caja Trujillo',
    buttons: [{ id: 'new', title: 'Nueva consulta' }],
  }, () => askDocType());
  F.step = 'idle';
}

// ═══════════════════════════════════════════════════════════════════════════
//  TEXTO LIBRE (barra de mensaje)
// ═══════════════════════════════════════════════════════════════════════════
async function sendMsg() {
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  outText(txt);

  if (F.step === 'dni') {
    if (/^\d{8}$/.test(txt)) return runCheck(txt);
    await typing(700);
    return WA.text('⚠️ El DNI debe tener *8 dígitos numéricos*. Inténtalo nuevamente.');
  }
  const l = txt.toLowerCase();
  if (['inicio', 'iniciar', 'consulta', 'menu', 'menú', 'hola', 'buenas'].some(k => l.includes(k))) return menu();
  await typing(700);
  if (active) return WA.text('Usa las opciones del último mensaje para continuar 👇');
  WA.text('Escribe *inicio* para comenzar una nueva consulta.');
}

menu(true);
</script>
