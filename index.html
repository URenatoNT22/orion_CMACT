<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ORION — WhatsApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-panel:  #1d1f1f;
      --bg-hover:  #2e2f2f;
      --bg-chat:   #161717;
      --bg-in:     #252626;
      --bg-out:    #144d37;
      --card:      #1d1f1f;
      --card-2:    #2a2c2c;
      --line:      #2c2e2e;
      --txt:       #e9edef;
      --txt-sub:   #aebac1;
      --txt-dim:   #8696a0;
      --green:     #21c063;
      --green-dk:  #1aa657;
      --green-bg:  rgba(33,192,99,.13);
      --green-bd:  rgba(33,192,99,.32);
      --red-txt:   #f28b82;
      --red-bg:    rgba(242,139,130,.12);
      --tick:      #53bdeb;
      --font: -apple-system,'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif;
    }

    html, body { height:100%; width:100%; overflow:hidden; background:#0a0a0a; font-family:var(--font); -webkit-font-smoothing:antialiased; }

    /* ══ ÍCONOS ══ */
    .ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block; }

    /* ══ WRAPPER ══ */
    .phone-wrap { width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg-chat); position:relative; max-width:430px; margin:0 auto; }

    /* ══ STATUS BAR ══ */
    .status-bar { height:28px; background:var(--bg-panel); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; z-index:20; }
    .sb-time-os { font-size:12px; font-weight:600; color:var(--txt); letter-spacing:.3px; }
    .sb-icons-os { display:flex; align-items:center; gap:6px; color:var(--txt); }
    .sb-icons-os svg { height:12px; width:auto; fill:currentColor; }

    /* ══ HEADER CHAT ══ */
    .chat-header { background:var(--bg-panel); height:58px; padding:0 8px 0 4px; display:flex; align-items:center; gap:6px; flex-shrink:0; z-index:10; border-bottom:1px solid #2a2b2b; }
    .ch-back { width:36px; height:36px; border:none; background:transparent; color:var(--txt); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; }
    .ch-back .ic { width:22px; height:22px; }
    .ch-av { width:38px; height:38px; border-radius:50%; background:#f9f8f8; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    .ch-av img { width:120%; height:90%; object-fit:contain; }
    .ch-info { flex:1; min-width:0; }
    .ch-name { color:var(--txt); font-size:15.5px; font-weight:500; line-height:1.2; display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .verified { width:15px; height:15px; color:var(--green); }
    .verified path:first-child { fill:currentColor; stroke:none; }
    .verified path:last-child { stroke:#102016; stroke-width:2.6; }
    .ch-status { color:var(--txt-dim); font-size:12px; display:flex; align-items:center; gap:5px; }
    .live-dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; display:inline-block; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(33,192,99,.5)} 50%{box-shadow:0 0 0 4px rgba(33,192,99,0)} }
    .ch-icons { display:flex; gap:2px; }
    .icon-btn { width:38px; height:38px; border-radius:50%; border:none; background:transparent; color:var(--txt-sub); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
    .icon-btn:active { background:var(--bg-hover); }
    .icon-btn .ic { width:21px; height:21px; }

    /* ══ FONDO ══ */
    .chat-bg { position:absolute; inset:0; background-image:url("wsp_fondo.png"); background-repeat:repeat; opacity:.1; pointer-events:none; z-index:0; }

    /* ══ MENSAJES ══ */
    .messages { flex:1; overflow-y:auto; padding:10px 4% 8px; display:flex; flex-direction:column; gap:3px; position:relative; z-index:1; -webkit-overflow-scrolling:touch; }
    .messages::-webkit-scrollbar { display:none; }
    .date-div { display:flex; justify-content:center; margin:8px 0 5px; }
    .date-div span { background:#1a2428; color:var(--txt-sub); font-size:11.5px; padding:4px 10px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.3); }
    .sys-note { display:flex; justify-content:center; margin:2px 0 8px; }
    .sys-note span { display:flex; align-items:center; gap:6px; background:#1a2428; color:#d1b468; font-size:11px; padding:5px 10px; border-radius:8px; max-width:88%; text-align:center; line-height:1.35; }
    .sys-note .ic { width:12px; height:12px; }

    .msg-row { display:flex; align-items:flex-end; animation:fadeUp .22s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.in  { flex-direction:row; }
    .msg-row.out { flex-direction:row-reverse; }

    .bubble { max-width:80%; padding:6px 8px 8px; border-radius:7.5px; font-size:14px; line-height:19px; color:var(--txt); position:relative; word-wrap:break-word; box-shadow:0 1px .5px rgba(0,0,0,.28); }
    .bubble:has(.ocard) { max-width:88%; }
    .bubble.wide { max-width:94%; }
    .msg-row.in .bubble  { background:var(--bg-in); border-top-left-radius:0; }
    .msg-row.in .bubble::before { content:''; position:absolute; top:0; left:-7px; border-width:0 7px 7px 0; border-style:solid; border-color:transparent var(--bg-in) transparent transparent; }
    .msg-row.out .bubble { background:var(--bg-out); border-top-right-radius:0; }
    .msg-row.out .bubble::after { content:''; position:absolute; top:0; right:-7px; border-width:0 0 7px 7px; border-style:solid; border-color:transparent transparent transparent var(--bg-out); }
    .msg-row.in + .msg-row.in .bubble, .msg-row.out + .msg-row.out .bubble { border-radius:7.5px; }
    .msg-row.in + .msg-row.in .bubble::before, .msg-row.out + .msg-row.out .bubble::after { display:none; }

    .msg-meta { display:flex; align-items:center; gap:3px; float:right; margin-left:8px; margin-top:4px; margin-bottom:-4px; }
    .msg-time { font-size:10.5px; color:var(--txt-dim); white-space:nowrap; }
    .msg-row.out .msg-time { color:#8fb5a5; }
    .ticks svg { width:16px; height:11px; display:block; }

    .out-line { display:flex; align-items:center; gap:6px; }
    .out-line .ic { width:14px; height:14px; color:#9fd8bd; }

    /* Typing */
    .typing-row { display:flex; margin-bottom:2px; }
    .typing-bub { background:var(--bg-in); border-radius:7.5px; border-top-left-radius:0; padding:11px 14px; display:flex; gap:4px; align-items:center; box-shadow:0 1px .5px rgba(0,0,0,.28); position:relative; }
    .typing-bub::before { content:''; position:absolute; top:0; left:-7px; border-width:0 7px 7px 0; border-style:solid; border-color:transparent var(--bg-in) transparent transparent; }
    .t-dot { width:7px; height:7px; background:var(--txt-dim); border-radius:50%; animation:bounce 1.3s infinite; }
    .t-dot:nth-child(2){animation-delay:.15s} .t-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

    /* ══ TARJETA ORION ══ */
    .ocard { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-top:6px; min-width:246px; overflow:hidden; }
    .ocard-hd { display:flex; align-items:center; gap:10px; padding:10px 12px; }
    .ocard-ico { width:34px; height:34px; border-radius:9px; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ocard-ico .ic { width:18px; height:18px; }
    .ocard-tx { flex:1; min-width:0; }
    .brand { font-size:9.5px; font-weight:700; letter-spacing:1.4px; color:var(--green); line-height:1.2; }
    .ocard-t { font-size:13.5px; font-weight:600; color:var(--txt); line-height:1.25; }
    .step-pill { font-size:10px; color:var(--txt-dim); border:1px solid var(--line); border-radius:10px; padding:2px 7px; white-space:nowrap; }

    /* Stepper */
    .stepper { display:flex; gap:4px; padding:0 12px 10px; }
    .stp { flex:1; }
    .stp-bar { height:3px; border-radius:2px; background:#333636; }
    .stp-l { font-size:9px; color:#5f6b72; margin-top:4px; letter-spacing:.3px; }
    .stp.done .stp-bar { background:var(--green); }
    .stp.done .stp-l { color:var(--txt-dim); }
    .stp.act .stp-bar { background:var(--green); box-shadow:0 0 6px rgba(33,192,99,.5); }
    .stp.act .stp-l { color:var(--green); font-weight:600; }

    /* Cliente */
    .client { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
    .avatar { width:38px; height:38px; border-radius:50%; background:#2f3d45; color:#cfe3ee; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; letter-spacing:.5px; }
    .client-n { font-size:14px; font-weight:600; color:var(--txt); line-height:1.25; }
    .client-m { font-size:11.5px; color:var(--txt-dim); display:flex; align-items:center; gap:6px; margin-top:2px; flex-wrap:wrap; }

    /* Pills */
    .pill { font-size:9.5px; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap; }
    .pill.ok  { background:var(--green-bg); color:var(--green); }
    .pill.no  { background:var(--red-bg); color:var(--red-txt); }
    .pill.neu { background:#2c3338; color:#b5c3cb; }

    /* Reglas con check */
    .rules { border-top:1px solid var(--line); }
    .rl { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid #262828; }
    .rl:last-child { border-bottom:none; }
    .rl-l { flex:1; font-size:12.5px; color:var(--txt-sub); line-height:1.3; transition:color .25s; }
    .rl.done .rl-l { color:var(--txt); }
    .rl-v { font-size:11px; font-weight:600; color:var(--txt); background:var(--card-2); padding:3px 8px; border-radius:10px; white-space:nowrap; opacity:0; transform:translateX(4px); transition:opacity .25s, transform .25s; }
    .rl.done .rl-v { opacity:1; transform:none; }
    .ck { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ck .ic { width:12px; height:12px; stroke-width:3.2; }
    .ck.spin { border:2px solid #383b3b; border-top-color:var(--green); animation:spin .75s linear infinite; }
    .ck.ok { background:var(--green); color:#0d2216; animation:pop .32s cubic-bezier(.3,1.6,.5,1); }
    .ck.no { background:var(--red-bg); color:var(--red-txt); }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pop { 0%{transform:scale(.3)} 100%{transform:scale(1)} }

    /* Veredicto */
    .verdict { display:flex; align-items:center; gap:10px; margin:2px 12px 12px; padding:10px 12px; border-radius:8px; background:var(--green-bg); border:1px solid var(--green-bd); animation:fadeUp .3s ease; }
    .verdict-ico { width:32px; height:32px; border-radius:50%; background:var(--green); color:#0d2216; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .verdict-ico .ic { width:17px; height:17px; stroke-width:2.4; }
    .verdict-t { font-size:14px; font-weight:800; color:var(--green); letter-spacing:.8px; line-height:1.2; }
    .verdict-s { font-size:11px; color:var(--txt-sub); line-height:1.3; }

    /* Opciones tipo lista */
    .opts { border-top:1px solid var(--line); }
    .opt { display:flex; align-items:center; gap:11px; padding:10px 12px; border-bottom:1px solid #262828; cursor:pointer; transition:background .12s; }
    .opt:last-child { border-bottom:none; }
    .opt:active { background:#262929; }
    .opt-ico { width:34px; height:34px; border-radius:9px; background:var(--card-2); color:var(--txt-sub); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
    .opt-tx { flex:1; min-width:0; }
    .opt-t { font-size:13.5px; color:var(--txt); font-weight:500; line-height:1.25; }
    .opt-d { font-size:11px; color:var(--txt-dim); line-height:1.3; margin-top:1px; }
    .radio { width:19px; height:19px; border-radius:50%; border:2px solid #5d6266; flex-shrink:0; transition:all .2s; }
    .opt.sel { background:rgba(33,192,99,.06); }
    .opt.sel .opt-ico { background:var(--green-bg); color:var(--green); }
    .opt.sel .radio { border-color:var(--green); background:var(--green); box-shadow:inset 0 0 0 3px var(--card); }
    .opt-arrow { color:var(--txt-dim); }
    .opt-arrow .ic { width:16px; height:16px; }
    .opt.dis { cursor:default; }
    .opt.dis .opt-ico { color:#5f6b72; }
    .opt.dis .opt-t { color:var(--txt-dim); }
    .opt.sel .opt-arrow { color:var(--green); }

    .summary-bar { display:flex; gap:12px; padding:8px 12px; border-top:1px solid var(--line); font-size:11px; color:var(--txt-dim); }
    .summary-bar b { color:var(--green); font-weight:700; }

    /* Formulario */
    .form { padding:12px; border-top:1px solid var(--line); }
    .fld-l { display:block; font-size:11px; color:var(--txt-sub); margin-bottom:5px; font-weight:500; }
    .fld { display:flex; align-items:center; background:var(--card-2); border:1px solid #3a3d3d; border-radius:8px; margin-bottom:11px; transition:border-color .15s, box-shadow .15s; }
    .fld:focus-within { border-color:var(--green); box-shadow:0 0 0 3px rgba(33,192,99,.15); }
    .fld-a { padding:0 0 0 11px; color:var(--txt-dim); font-size:13px; font-weight:600; display:flex; align-items:center; }
    .fld-a.suf { padding:0 11px 0 0; font-weight:500; }
    .fld-a .ic { width:16px; height:16px; }
    .fld input, .fld select { flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--txt); font-size:14.5px; padding:10px 11px; font-family:var(--font); -webkit-appearance:none; appearance:none; }
    .fld select option { background:#1d1f1f; }
    .fld input::placeholder { color:#5f6b72; }
    .fld input::-webkit-outer-spin-button, .fld input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .fld input[type=number] { -moz-appearance:textfield; }
    .fld-err { font-size:11px; color:var(--red-txt); margin:-6px 0 10px; display:none; align-items:center; gap:5px; }
    .fld-err.show { display:flex; }
    .fld-err .ic { width:12px; height:12px; }
    .btn-p { width:100%; display:flex; align-items:center; justify-content:center; gap:7px; background:var(--green); color:#0d2216; border:none; border-radius:8px; padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--font); transition:background .15s; }
    .btn-p:active { background:var(--green-dk); }
    .btn-p .ic { width:16px; height:16px; stroke-width:2.4; }

    /* Botones de respuesta rápida (estilo WhatsApp) */
    .bub-btns { border-top:1px solid #3a3c3c; margin:8px -8px -8px; display:flex; }
    .bb-btn { flex:1; background:none; border:none; color:var(--green); font-size:13.5px; font-weight:500; padding:11px 6px; cursor:pointer; font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:6px; }
    .bb-btn .ic { width:16px; height:16px; }
    .bb-btn:not(:last-child) { border-right:1px solid #3a3c3c; }
    .bb-btn:active { background:rgba(255,255,255,.05); }
    .bb-btn:first-child { border-bottom-left-radius:7.5px; }
    .bb-btn:last-child  { border-bottom-right-radius:7.5px; }

    /* Módulos (ayuda) */
    .mod { display:flex; align-items:center; gap:11px; padding:9px 12px; border-top:1px solid #262828; }
    .mod-n { width:22px; height:22px; border-radius:50%; background:var(--card-2); color:var(--txt-sub); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .mod-t { font-size:13px; color:var(--txt); font-weight:600; }
    .mod-d { font-size:11px; color:var(--txt-dim); }

    /* Explain */
    .sgrid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-top:1px solid var(--line); }
    .sg { background:var(--card); padding:8px 12px; }
    .sg-l { font-size:9.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--txt-dim); }
    .sg-v { font-size:12.5px; color:var(--txt); font-weight:600; margin-top:2px; line-height:1.3; }
    .sec { padding:12px; border-top:1px solid var(--line); }
    .sec-t { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; color:var(--txt-sub); margin-bottom:9px; }
    .sec-t .ic { width:13px; height:13px; color:var(--green); }
    .seg { display:flex; align-items:center; gap:11px; }
    .seg-badge { min-width:46px; height:46px; padding:0 8px; border-radius:11px; background:var(--green-bg); border:1px solid var(--green-bd); color:var(--green); font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; letter-spacing:.5px; }
    .seg-t { font-size:13px; color:var(--txt); font-weight:600; }
    .seg-d { font-size:11px; color:var(--txt-dim); line-height:1.35; }
    .tbl-cap { font-size:11px; color:var(--txt-sub); margin-bottom:7px; line-height:1.35; }
    .tbl { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .tbl table { width:100%; border-collapse:collapse; font-size:10.5px; table-layout:fixed; }
    .tbl th, .tbl td { padding:7px 2px; text-align:center; color:var(--txt-sub); border-bottom:1px solid #262828; }
    .tbl tr:last-child td { border-bottom:none; }
    .tbl th { background:#232525; color:var(--txt); font-weight:700; font-size:10.5px; }
    .tbl th:first-child, .tbl td:first-child { text-align:left; padding-left:9px; width:36%; color:var(--txt-sub); font-weight:500; }
    .tbl th:first-child { color:var(--txt-dim); font-weight:600; font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; }
    .tbl td.hl { background:var(--green-bg); color:var(--green); font-weight:700; }
    .tbl th.hl { background:var(--green); color:#0d2216; }
    .tbl-note { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--txt-dim); margin-top:7px; }
    .tbl-note .ic { width:12px; height:12px; color:var(--green); }
    .lvl { display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 8px; border-radius:16px; background:var(--green-bg); border:1px solid var(--green-bd); color:var(--green); font-weight:700; font-size:12.5px; }
    .lvl .ic { width:15px; height:15px; }
    .cond { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #262828; }
    .cond:first-of-type { padding-top:0; }
    .cond:last-child { border-bottom:none; padding-bottom:0; }
    .cond-ico { width:30px; height:30px; border-radius:8px; background:var(--card-2); color:var(--txt-sub); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .cond-ico .ic { width:15px; height:15px; }
    .cond-l { flex:1; font-size:12px; color:var(--txt-sub); }
    .cond-v { font-size:12.5px; color:var(--txt); font-weight:600; text-align:right; }
    .cond-v.yes { color:var(--green); }

    /* Bloqueo tras responder */
    .msg-row.locked .opt, .msg-row.locked .bb-btn, .msg-row.locked .btn-p { pointer-events:none; }
    .msg-row.locked .bb-btn, .msg-row.locked .btn-p { opacity:.38; }
    .msg-row.locked .opt:not(.sel) { opacity:.42; }
    .msg-row.locked .fld { opacity:.65; }

    /* ══ INPUT BAR ══ */
    .input-bar { background:var(--bg-panel); min-height:58px; padding:8px 8px; display:flex; align-items:center; gap:6px; flex-shrink:0; z-index:10; border-top:1px solid #2a2b2b; }
    .ib-box { flex:1; display:flex; align-items:center; background:var(--bg-hover); border-radius:22px; padding:0 4px; min-height:42px; }
    .ib-box .icon-btn { width:34px; height:34px; color:var(--txt-dim); }
    .ib-box .icon-btn .ic { width:20px; height:20px; }
    .ib-input { flex:1; min-width:0; background:transparent; border:none; padding:9px 4px; color:var(--txt); font-size:15px; font-family:var(--font); outline:none; }
    .ib-input::placeholder { color:var(--txt-dim); }
    .ib-send { width:44px; height:44px; border-radius:50%; background:var(--green); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#0d2216; transition:background .15s; }
    .ib-send:active { background:var(--green-dk); }
    .ib-send .ic { width:20px; height:20px; stroke-width:2.2; }

    .home-indicator { height:20px; background:var(--bg-panel); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .home-bar { width:120px; height:4px; background:#464747; border-radius:2px; }
  </style>
</head>
<body>

<div class="phone-wrap">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="sb-time-os" id="os-time">9:41</span>
    <div class="sb-icons-os">
      <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" y="0" width="3" height="12" rx=".6"/></svg>
      <svg viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.6 10.6 0 0 0 8 .4C5.2.4 2.5 1.5.5 3.4l1.2 1.3A9 9 0 0 1 8 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3A7.2 7.2 0 0 0 8 4c-1.8 0-3.6.7-4.9 1.9l1.2 1.3c1-.9 2.3-1.4 3.7-1.4zM8 9.3c-.6 0-1.2.2-1.6.6L8 11.6l1.6-1.7c-.4-.4-1-.6-1.6-.6z"/></svg>
      <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.8"/><rect x="23.5" y="4" width="2" height="4" rx="1" opacity=".45"/></svg>
    </div>
  </div>

  <!-- CHAT HEADER -->
  <div class="chat-header">
    <button class="ch-back" aria-label="Volver"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="ch-av"><img src="Logo.png" alt="ORION"></div>
    <div class="ch-info">
      <div class="ch-name">ORION Agente
        <svg class="ic verified" viewBox="0 0 24 24"><path d="M12 1.5l2.6 1.9 3.2-.1 1 3.1 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3.1-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3.1-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3.1 3.2.1z"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>
      </div>
      <div class="ch-status" id="ch-status"><span class="live-dot"></span> en línea</div>
    </div>
    <div class="ch-icons">
      <button class="icon-btn" aria-label="Llamar"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
      <button class="icon-btn" aria-label="Más"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
  </div>

  <div class="chat-bg"></div>

  <!-- MENSAJES -->
  <div class="messages" id="messages">
    <div class="date-div"><span>Hoy</span></div>
    <div class="sys-note"><span>
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Canal interno de Caja Trujillo. La información del cliente es confidencial.
    </span></div>
  </div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <div class="ib-box">
      <button class="icon-btn" aria-label="Emoji"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>
      <input class="ib-input" id="msg-input" type="text" placeholder="Mensaje" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="icon-btn" aria-label="Adjuntar"><svg class="ic" viewBox="0 0 24 24"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
    </div>
    <button class="ib-send" onclick="sendMsg()" aria-label="Enviar"><svg class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
  </div>

  <div class="home-indicator"><div class="home-bar"></div></div>
</div>

<script>
  // ════════════════════════════════════════════════════════════════════════
  //  ÍCONOS (trazo lineal, estilo consistente)
  // ════════════════════════════════════════════════════════════════════════
  const ICONS = {
    check:    '<path d="M20 6 9 17l-5-5"/>',
    x:        '<path d="M18 6 6 18M6 6l12 12"/>',
    chev:     '<path d="m9 18 6-6-6-6"/>',
    arrow:    '<path d="M5 12h14M13 5l7 7-7 7"/>',
    search:   '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    help:     '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
    user:     '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    users:    '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    id:       '<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.2"/><path d="M14 10h4M14 14h4"/>',
    shield:   '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
    building: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    store:    '<path d="M3 9 4.5 4h15L21 9M4 9v11h16V9M3 9h18M10 20v-5h4v5"/>',
    box:      '<path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
    trend:    '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
    cart:     '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2.5l2.7 12.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L22 7H5.1"/>',
    coins:    '<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.3 18M7 6h1v4M16.7 13.9l.7.7-2.8 2.8"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    file:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
    landmark: '<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l9 5H3z"/>',
    percent:  '<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    alert:    '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    award:    '<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',
    layers:   '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
    refresh:  '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    zap:      '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
    gift:     '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C9 3 12 8 12 8s3-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    target:   '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    grid:     '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/>',
    flag:     '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    info:     '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    send:     '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  };
  const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;

  // ════════════════════════════════════════════════════════════════════════
  //  CONFIGURACIÓN DEL DEMO (todo editable aquí)
  // ════════════════════════════════════════════════════════════════════════
  const CFG = {
    clients: {
      '12345678': { name: 'Carlos Mendoza',  status: 'recurrente' },
      '87654321': { name: 'Ana Ríos Torres', status: 'nuevo' },
    },
    segmento: 'AA',

    checkRules: [
      { l: 'Segmento',                                              v: () => CFG.segmento },
      { l: 'Lista negativa',                                        v: () => 'No registra' },
      { l: 'Calificación RCC actual',                               v: () => 'Normal' },
      { l: 'Calif. Deficiente, Dudoso y Pérdida (últ. 6 meses)',    v: () => 'Sin registros' },
      { l: 'Castigado, judicial o venta (últ. 24 meses)',           v: () => 'Sin registros' },
    ],

    fuentes: [
      { t: 'Dependiente',    d: 'Ingresos por planilla',            i: 'building' },
      { t: 'Independiente',  d: 'Ingresos por servicios propios',   i: 'briefcase' },
      { t: 'Negocio propio', d: 'Ingresos de actividad comercial',  i: 'store' },
    ],
    destinos: [
      { t: 'Activo fijo',         d: 'Maquinaria, equipos o local',     i: 'box' },
      { t: 'Capital de trabajo',  d: 'Mercadería, insumos y operación', i: 'trend' },
      { t: 'Consumo',             d: 'Gastos personales',               i: 'cart' },
    ],

    products: [
      { t: 'Disfruta +',        d: 'Crédito de consumo',     i: 'cart',      ok: false },
      { t: 'Emprende +',        d: 'Crédito emprendedor',    i: 'trend',     ok: false },
      { t: 'Microemprendedor',  d: 'Pequeña empresa',        i: 'store',     ok: true  },
      { t: '+ Negocios',        d: 'Crédito empresarial',    i: 'briefcase', ok: true  },
      { t: 'Campaña Crediagil', d: 'Campaña vigente',        i: 'zap',       ok: true  },
      { t: 'Campaña Navideña',  d: 'Campaña de temporada',   i: 'gift',      ok: true  },
    ],

    verify: { entidades: '2', calificacion: 'Normal', saldoPagado: '60%' },

    ratioTable: {
      title: 'Ratio de cuota límite en función al ingreso neto — Pequeña empresa',
      cols: ['AAA', 'AA', 'A', 'B', 'C'],
      rows: [
        { label: 'Hasta S/ 2,000',       vals: ['≤ 80%', '≤ 80%', '≤ 70%', '≤ 60%', '≤ 60%'] },
        { label: 'S/ 2,000 – 10,000',    vals: ['≤ 85%', '≤ 85%', '≤ 80%', '≤ 70%', '≤ 65%'] },
        { label: 'Más de S/ 10,000',     vals: ['≤ 90%', '≤ 90%', '≤ 80%', '≤ 75%', '≤ 70%'] },
      ],
    },
    explain: {
      nivel: 'Líder',
      conds: [
        { l: 'Documento del negocio', v: 'Declaración jurada',  i: 'file' },
        { l: 'Garantía',              v: 'Patrimonio personal', i: 'landmark' },
        { l: 'TEA mínima',            v: '45%',                 i: 'percent' },
        { l: 'Excepciones',           v: 'No aplica',           i: 'alert' },
        { l: 'Requiere cónyuge',      v: 'Sí',                  i: 'users', yes: true },
      ],
    },
  };

  const STEPS = ['Check', 'Match', 'Verify', 'Explain'];

  // ════════════════════════════════════════════════════════════════════════
  //  UTILIDADES
  // ════════════════════════════════════════════════════════════════════════
  function updateOsTime() {
    document.getElementById('os-time').textContent =
      new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
  }
  updateOsTime(); setInterval(updateOsTime, 10000);

  const box = document.getElementById('messages');
  const statusEl = document.getElementById('ch-status');
  const STATUS_ONLINE = statusEl.innerHTML;

  let flow = {};
  function resetFlow() {
    flow = { step: 'idle', docType: 'DNI', dni: '', client: null, fuente: null, destino: null,
             product: null, amount: 0, years: 0, formRow: null };
  }
  resetFlow();

  const TICKS = `<svg viewBox="0 0 16 11"><path fill="#53bdeb" d="M11.07.65a.75.75 0 0 1 .03 1.06l-6 6.5a.75.75 0 0 1-1.1 0L1.45 5.47a.75.75 0 1 1 1.1-1.02l2 2.15 5.46-5.92a.75.75 0 0 1 1.06-.03zm3.5 0a.75.75 0 0 1 .03 1.06l-6 6.5a.75.75 0 0 1-1.07.03l-.5-.47a.75.75 0 1 1 1.03-1.09l-.05.04 5.5-5.97a.75.75 0 0 1 1.06-.1z"/></svg>`;

  const sleep  = ms => new Promise(r => setTimeout(r, ms));
  const hhmm   = () => new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
  const fmt    = n => Number(n).toLocaleString('es-PE');
  const scroll = () => { box.scrollTop = box.scrollHeight; };
  const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

  function addMsg(html, dir = 'in', extraClass = '') {
    const row = document.createElement('div');
    row.className = `msg-row ${dir}`;
    const meta = `<div class="msg-meta"><span class="msg-time">${hhmm()}</span>${dir === 'out' ? `<span class="ticks">${TICKS}</span>` : ''}</div>`;
    row.innerHTML = `<div class="bubble ${extraClass}">${html}${meta}</div>`;
    box.appendChild(row);
    scroll();
    return Promise.resolve(row);
  }
  const addOut = (icon, text) => addMsg(`<span class="out-line">${ic(icon)}<span>${text}</span></span>`, 'out');

  async function showTyping(ms = 1200) {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.innerHTML = `<div class="typing-bub"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>`;
    box.appendChild(row); scroll();
    statusEl.textContent = 'escribiendo…';
    await sleep(ms);
    row.remove();
    statusEl.innerHTML = STATUS_ONLINE;
  }

  function lock(el) {
    const row = el && el.closest ? el.closest('.msg-row') : el;
    if (!row) return;
    row.classList.add('locked');
    row.querySelectorAll('button, input, select').forEach(e => e.disabled = true);
  }

  // Cabecera estándar de tarjeta ORION
  function cardHead(icon, module, title, stepIdx) {
    const stepper = stepIdx == null ? '' : `
      <div class="stepper">
        ${STEPS.map((s, i) => `
          <div class="stp ${i < stepIdx ? 'done' : i === stepIdx ? 'act' : ''}">
            <div class="stp-bar"></div><div class="stp-l">${s}</div>
          </div>`).join('')}
      </div>`;
    return `
      <div class="ocard-hd">
        <div class="ocard-ico">${ic(icon)}</div>
        <div class="ocard-tx">
          <div class="brand">ORION · ${module}</div>
          <div class="ocard-t">${title}</div>
        </div>
        ${stepIdx == null ? '' : `<span class="step-pill">${stepIdx + 1} de ${STEPS.length}</span>`}
      </div>${stepper}`;
  }

  // Reglas: se pintan "cargando" y luego se aprueban una a una
  function rulesHtml(rules) {
    return `<div class="rules">${rules.map(r => `
      <div class="rl">
        <span class="ck spin"></span>
        <span class="rl-l">${r.l}</span>
        <span class="rl-v">${r.v}</span>
      </div>`).join('')}</div>`;
  }
  async function resolveRules(scope, gap = 430) {
    for (const rl of scope.querySelectorAll('.rl')) {
      await sleep(gap);
      const ck = rl.querySelector('.ck');
      ck.className = 'ck ok';
      ck.innerHTML = ic('check');
      rl.classList.add('done');
    }
  }
  function verdictHtml(title, sub) {
    return `
      <div class="verdict">
        <div class="verdict-ico">${ic('shield')}</div>
        <div><div class="verdict-t">${title}</div><div class="verdict-s">${sub}</div></div>
      </div>`;
  }

  function optionsHtml(options, handler) {
    return `<div class="opts">${options.map((o, i) => `
      <div class="opt" onclick="${handler}(this, ${i})">
        <div class="opt-ico">${ic(o.i)}</div>
        <div class="opt-tx"><div class="opt-t">${o.t}</div><div class="opt-d">${o.d}</div></div>
        <span class="radio"></span>
      </div>`).join('')}</div>`;
  }

  function selectOpt(el) {
    el.classList.add('sel');
    lock(el);
  }

  // ════════════════════════════════════════════════════════════════════════
  //  1. BIENVENIDA
  // ════════════════════════════════════════════════════════════════════════
  async function showMenu(first = false) {
    resetFlow();
    await showTyping(first ? 900 : 700);
    await addMsg(`
      ${first ? 'Hola, soy el <b>Agente ORION</b> de Caja Trujillo.<br>' : ''}
      Puedo <b>precalificar a un cliente</b> con su documento de identidad y acompañarte hasta la guía operativa.
      <div class="bub-btns">
        <button class="bb-btn" onclick="askDocument(this)">${ic('search')} Iniciar consulta</button>
        <button class="bb-btn" onclick="showHelp(this)">${ic('help')} Ayuda</button>
      </div>
    `);
  }

  async function showHelp(btn) {
    lock(btn);
    await addOut('help', 'Ayuda');
    await showTyping(900);
    const mods = [
      ['Check',   'Precalificación por documento'],
      ['Match',   'Productos aptos según el perfil'],
      ['Verify',  'Condiciones del producto elegido'],
      ['Explain', 'Lineamientos y guía operativa'],
    ];
    await addMsg(`
      El proceso tiene cuatro etapas:
      <div class="ocard">
        ${cardHead('layers', 'FLUJO', 'Etapas de evaluación')}
        ${mods.map((m, i) => `
          <div class="mod">
            <span class="mod-n">${i + 1}</span>
            <div><div class="mod-t">${m[0]}</div><div class="mod-d">${m[1]}</div></div>
          </div>`).join('')}
      </div>
      <div class="bub-btns">
        <button class="bb-btn" onclick="askDocument(this)">${ic('search')} Iniciar consulta</button>
      </div>
    `);
  }

  // ════════════════════════════════════════════════════════════════════════
  //  2. DOCUMENTO
  // ════════════════════════════════════════════════════════════════════════
  async function askDocument(btn) {
    if (btn) { lock(btn); await addOut('search', 'Iniciar consulta'); }
    await showTyping(900);
    flow.formRow = await addMsg(`
      Ingresa el documento del cliente para iniciar la precalificación.
      <div class="ocard">
        ${cardHead('id', 'CHECK', 'Identificación del cliente', 0)}
        <div class="form">
          <label class="fld-l">Tipo de documento</label>
          <div class="fld">
            <span class="fld-a">${ic('id')}</span>
            <select class="f-doctype"><option value="DNI">DNI — Documento Nacional de Identidad</option></select>
          </div>
          <label class="fld-l">Número de documento</label>
          <div class="fld">
            <span class="fld-a">${ic('user')}</span>
            <input class="f-docnum" type="text" inputmode="numeric" maxlength="8" placeholder="8 dígitos" autocomplete="off"
                   oninput="this.value=this.value.replace(/\\D/g,'');this.closest('.form').querySelector('.fld-err').classList.remove('show')"
                   onkeydown="if(event.key==='Enter')submitDocument(this)">
          </div>
          <div class="fld-err">${ic('info')} El DNI debe tener 8 dígitos.</div>
          <button class="btn-p" onclick="submitDocument(this)">Consultar ${ic('arrow')}</button>
        </div>
      </div>
    `);
    flow.step = 'dni';
    const inp = flow.formRow.querySelector('.f-docnum');
    if (inp) inp.focus();
  }

  function submitDocument(el) {
    const form = el.closest('.form');
    const type = form.querySelector('.f-doctype').value;
    const num  = form.querySelector('.f-docnum').value.trim();
    if (!/^\d{8}$/.test(num)) { form.querySelector('.fld-err').classList.add('show'); return; }
    lock(el);
    runCheck(type, num);
  }

  // ════════════════════════════════════════════════════════════════════════
  //  3. ORION CHECK
  // ════════════════════════════════════════════════════════════════════════
  async function runCheck(type, dni) {
    flow.step = 'check';
    flow.docType = type;
    flow.dni = dni;
    flow.client = CFG.clients[dni] || { name: `Cliente ${dni}`, status: 'nuevo' };

    await addOut('id', `${type} ${dni}`);
    await showTyping(1300);

    const c = flow.client;
    const row = await addMsg(`
      <div class="ocard">
        ${cardHead('shield', 'CHECK', 'Precalificación del cliente', 0)}
        <div class="client">
          <div class="avatar">${initials(c.name)}</div>
          <div>
            <div class="client-n">${c.name}</div>
            <div class="client-m">${type} ${dni} <span class="pill neu">${c.status}</span></div>
          </div>
        </div>
        ${rulesHtml(CFG.checkRules.map(r => ({ l: r.l, v: r.v() })))}
        <div class="js-verdict"></div>
      </div>
    `);

    await resolveRules(row);
    await sleep(350);
    row.querySelector('.js-verdict').innerHTML =
      verdictHtml('APTO', `Cumple las ${CFG.checkRules.length} reglas · Segmento ${CFG.segmento}`);
    scroll();

    await askFuente();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  3.2 FUENTE Y DESTINO
  // ════════════════════════════════════════════════════════════════════════
  async function askFuente() {
    flow.step = 'fuente';
    await showTyping(1000);
    await addMsg(`
      Selecciona la <b>fuente de ingreso</b> del cliente:
      <div class="ocard">${optionsHtml(CFG.fuentes, 'pickFuente')}</div>
    `);
  }

  async function pickFuente(el, i) {
    selectOpt(el);
    flow.fuente = CFG.fuentes[i];
    await addOut(flow.fuente.i, flow.fuente.t);
    flow.step = 'destino';
    await showTyping(900);
    await addMsg(`
      Ahora indica el <b>destino del crédito</b>:
      <div class="ocard">${optionsHtml(CFG.destinos, 'pickDestino')}</div>
    `);
  }

  async function pickDestino(el, i) {
    selectOpt(el);
    flow.destino = CFG.destinos[i];
    await addOut(flow.destino.i, flow.destino.t);
    await doMatch();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  4. ORION MATCH
  // ════════════════════════════════════════════════════════════════════════
  async function doMatch() {
    flow.step = 'match';
    await showTyping(1500);
    const nOk = CFG.products.filter(p => p.ok).length;
    const nNo = CFG.products.length - nOk;
    await addMsg(`
      Productos evaluados para <b>${flow.client.name}</b>. Toca uno apto para continuar.
      <div class="ocard">
        ${cardHead('target', 'MATCH', `${flow.fuente.t} · ${flow.destino.t}`, 1)}
        <div class="summary-bar"><span><b>${nOk}</b> aptos</span><span>${nNo} no aptos</span></div>
        <div class="opts">
          ${CFG.products.map((p, i) => `
            <div class="opt ${p.ok ? '' : 'dis'}" ${p.ok ? `onclick="doSelectProduct(this, ${i})"` : ''}>
              <div class="opt-ico">${ic(p.i)}</div>
              <div class="opt-tx"><div class="opt-t">${p.t}</div><div class="opt-d">${p.d}</div></div>
              <span class="pill ${p.ok ? 'ok' : 'no'}">${p.ok ? 'Apto' : 'No apto'}</span>
              ${p.ok ? `<span class="opt-arrow">${ic('chev')}</span>` : ''}
            </div>`).join('')}
        </div>
      </div>
    `);
  }

  // ════════════════════════════════════════════════════════════════════════
  //  5. PRODUCTO Y DATOS
  // ════════════════════════════════════════════════════════════════════════
  async function doSelectProduct(el, i) {
    selectOpt(el);
    flow.product = CFG.products[i];
    await addOut(flow.product.i, flow.product.t);
    flow.step = 'params';
    await showTyping(1000);
    await addMsg(`
      Completa los datos de la operación:
      <div class="ocard">
        ${cardHead(flow.product.i, 'VERIFY', flow.product.t, 2)}
        <div class="form">
          <label class="fld-l">Monto solicitado</label>
          <div class="fld">
            <span class="fld-a">S/</span>
            <input class="f-amount" type="number" inputmode="numeric" placeholder="0" min="1">
          </div>
          <label class="fld-l">Tiempo de funcionamiento del negocio</label>
          <div class="fld">
            <span class="fld-a">${ic('calendar')}</span>
            <input class="f-years" type="number" inputmode="decimal" placeholder="0" min="0" step="0.5">
            <span class="fld-a suf">años</span>
          </div>
          <div class="fld-err">${ic('info')} Completa el monto y la antigüedad del negocio.</div>
          <button class="btn-p" onclick="doVerify(this)">Evaluar condiciones ${ic('arrow')}</button>
        </div>
      </div>
    `);
  }

  // ════════════════════════════════════════════════════════════════════════
  //  6. ORION VERIFY
  // ════════════════════════════════════════════════════════════════════════
  async function doVerify(el) {
    const form = el.closest('.form');
    const amount = parseFloat(form.querySelector('.f-amount').value);
    const years  = parseFloat(form.querySelector('.f-years').value);
    if (!amount || amount <= 0 || isNaN(years) || years < 0) {
      form.querySelector('.fld-err').classList.add('show');
      return;
    }
    lock(el);
    flow.amount = amount;
    flow.years  = years;
    flow.step   = 'verify';

    await addOut('coins', `S/ ${fmt(amount)} · ${fmt(years)} año(s) de negocio`);
    await showTyping(1400);

    const rules = [
      { l: 'Segmento',               v: CFG.segmento },
      { l: 'Número de entidades',    v: CFG.verify.entidades },
      { l: 'Calificación actual',    v: CFG.verify.calificacion },
      { l: 'Monto',                  v: `S/ ${fmt(amount)}` },
      { l: 'Antigüedad del negocio', v: `${fmt(years)} año(s)` },
      { l: '% Saldo pagado',         v: CFG.verify.saldoPagado },
    ];

    const row = await addMsg(`
      <div class="ocard">
        ${cardHead('clipboard', 'VERIFY', `Condiciones · ${flow.product.t}`, 2)}
        ${rulesHtml(rules)}
        <div class="js-verdict"></div>
      </div>
      <div class="js-btns"></div>
    `);

    await resolveRules(row, 380);
    await sleep(350);
    row.querySelector('.js-verdict').innerHTML =
      verdictHtml('APTO', 'Cumple todas las condiciones del producto');
    row.querySelector('.js-btns').innerHTML = `
      <div class="bub-btns">
        <button class="bb-btn" onclick="doExplain(this)">${ic('file')} Ver guía operativa</button>
      </div>`;
    scroll();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  7. ORION EXPLAIN
  // ════════════════════════════════════════════════════════════════════════
  async function doExplain(el) {
    lock(el);
    flow.step = 'explain';
    await addOut('file', 'Ver guía operativa');
    await showTyping(1300);

    const t = CFG.ratioTable;
    const s = t.cols.indexOf(CFG.segmento);
    const e = CFG.explain;

    await addMsg(`
      <div class="ocard">
        ${cardHead('award', 'EXPLAIN', 'Guía operativa', 3)}

        <div class="sgrid">
          <div class="sg"><div class="sg-l">Cliente</div><div class="sg-v">${flow.client.name}</div></div>
          <div class="sg"><div class="sg-l">Producto</div><div class="sg-v">${flow.product.t}</div></div>
          <div class="sg"><div class="sg-l">Monto</div><div class="sg-v">S/ ${fmt(flow.amount)}</div></div>
          <div class="sg"><div class="sg-l">Antigüedad</div><div class="sg-v">${fmt(flow.years)} año(s)</div></div>
          <div class="sg"><div class="sg-l">Fuente</div><div class="sg-v">${flow.fuente.t}</div></div>
          <div class="sg"><div class="sg-l">Destino</div><div class="sg-v">${flow.destino.t}</div></div>
        </div>

        <div class="sec">
          <div class="sec-t">${ic('layers')} Segmento del cliente</div>
          <div class="seg">
            <div class="seg-badge">${CFG.segmento}</div>
            <div><div class="seg-t">Segmento ${CFG.segmento}</div><div class="seg-d">Asignado en la precalificación. Define el ratio de cuota límite aplicable.</div></div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-t">${ic('grid')} Ratio de cuota límite</div>
          <div class="tbl-cap">${t.title}</div>
          <div class="tbl">
            <table>
              <thead><tr>
                <th>Ingreso neto</th>
                ${t.cols.map((c, i) => `<th class="${i === s ? 'hl' : ''}">${c}</th>`).join('')}
              </tr></thead>
              <tbody>
                ${t.rows.map(r => `<tr>
                  <td>${r.label}</td>
                  ${r.vals.map((v, i) => `<td class="${i === s ? 'hl' : ''}">${v}</td>`).join('')}
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="tbl-note">${ic('check')} Columna aplicable al segmento ${CFG.segmento}</div>
        </div>

        <div class="sec">
          <div class="sec-t">${ic('shield')} Nivel de aprobación</div>
          <span class="lvl">${ic('award')} ${e.nivel}</span>
        </div>

        <div class="sec">
          <div class="sec-t">${ic('clipboard')} Condiciones</div>
          ${e.conds.map(c => `
            <div class="cond">
              <div class="cond-ico">${ic(c.i)}</div>
              <span class="cond-l">${c.l}</span>
              <span class="cond-v ${c.yes ? 'yes' : ''}">${c.v}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="bub-btns">
        <button class="bb-btn" onclick="doFinish(this)">${ic('flag')} Finalizar</button>
      </div>
    `, 'in', 'wide');
  }

  async function doFinish(el) {
    lock(el);
    await addOut('flag', 'Operación finalizada');
    await showTyping(700);
    await addMsg(`
      La evaluación de <b>${flow.client.name}</b> quedó registrada. Puedes atender al siguiente cliente.
      <div class="bub-btns">
        <button class="bb-btn" onclick="askDocument(this)">${ic('refresh')} Nueva consulta</button>
      </div>
    `);
    resetFlow();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  TEXTO LIBRE
  // ════════════════════════════════════════════════════════════════════════
  async function sendMsg() {
    const inp = document.getElementById('msg-input');
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';

    if (flow.step === 'dni' && /^\d{8}$/.test(txt)) {
      lock(flow.formRow);
      return runCheck('DNI', txt);
    }

    await addMsg(txt, 'out');
    const l = txt.toLowerCase();

    if (flow.step === 'dni' && /^\d+$/.test(txt)) {
      await showTyping(700);
      return addMsg('El DNI debe tener 8 dígitos. Inténtalo nuevamente.');
    }
    if (['inicio', 'iniciar', 'consulta', 'consultar', 'dni', 'empezar'].some(k => l.includes(k))) return askDocument();
    if (['hola', 'buenas', 'menu', 'menú'].some(k => l.includes(k))) return showMenu();
    await showTyping(800);
    if (l.includes('ayuda') || l.includes('help'))
      return addMsg('Escribe <b>inicio</b> o usa <b>Iniciar consulta</b> para precalificar a un cliente con su DNI.');
    if (flow.step !== 'idle') return addMsg('Continúa con las opciones del mensaje anterior para avanzar.');
    addMsg('Escribe <b>inicio</b> para comenzar una nueva consulta.');
  }

  showMenu(true);
</script>
</body>
</html>
