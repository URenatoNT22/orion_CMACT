<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ORION — WhatsApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-app:    #161717;
      --bg-panel:  #1d1f1f;
      --bg-hover:  #2e2f2f;
      --bg-chat:   #161717;
      --bg-in:     #252626;
      --bg-out:    #144d37;
      --border:    #2e2f2f;
      --txt:       #e9edef;
      --txt-sub:   #aebac1;
      --txt-dim:   #8696a0;
      --green:     #21c063;
      --green-dk:  #1aa657;
      --tick:      #b6d7ca;
      --red:       #cc0000;
      --yellow:    #f5a800;
      --font: -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: var(--font);
    }

    /* ══ WRAPPER — simula cuerpo del teléfono ══ */
    .phone-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      position: relative;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ══ STATUS BAR (barra superior del SO) ══ */
    .status-bar {
      height: 28px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 20;
    }
    .sb-time-os {
      font-size: 12px;
      font-weight: 600;
      color: var(--txt);
      letter-spacing: .3px;
    }
    .sb-icons-os {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--txt);
    }
    .sb-icons-os svg { width: 14px; height: 14px; fill: currentColor; }
    .sb-battery {
      font-size: 11px;
      font-weight: 600;
      color: var(--txt);
    }

    /* ══ HEADER CHAT (barra de conversación) ══ */
    .chat-header {
      background: var(--bg-panel);
      height: 58px;
      padding: 0 8px 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
      border-bottom: 1px solid #2a2b2b;
    }

    .ch-back {
      width: 36px; height: 36px;
      border: none; background: transparent;
      color: var(--txt); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ch-back svg { width: 22px; height: 22px; fill: currentColor; }

    .ch-av {
      width: 38px; height: 38px; border-radius: 50%;
      background: #f9f8f8;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; overflow: hidden;
      flex-shrink: 0; cursor: pointer;
    }
    .ch-av img { width: 120%; height: 90%; object-fit: contain; }

    .ch-info { flex: 1; min-width: 0; cursor: pointer; }
    .ch-name {
      color: var(--txt);
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-status {
      color: var(--txt-dim);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
      display: inline-block;
    }
    @keyframes pulse {
      0%,100%{ box-shadow: 0 0 0 0 rgba(33,192,99,.5) }
      50%{ box-shadow: 0 0 0 4px rgba(33,192,99,0) }
    }

    .ch-icons { display: flex; gap: 2px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: transparent;
      color: var(--txt-sub); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .icon-btn:active { background: var(--bg-hover); }
    .icon-btn svg { width: 21px; height: 21px; fill: currentColor; }

    /* ══ FONDO CHAT ══ */
    .chat-bg {
      position: absolute;
      inset: 0;
      background-image: url("wsp_fondo.png");
      background-repeat: repeat;
      background-size: auto;
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
    }

    /* ══ MENSAJES ══ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 4% 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      z-index: 1;
      -webkit-overflow-scrolling: touch;
    }
    .messages::-webkit-scrollbar { display: none; }

    .date-div { display: flex; justify-content: center; margin: 8px 0 5px; }
    .date-div span {
      background: #1a2428;
      color: var(--txt-sub);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 1px .5px rgba(0,0,0,.3);
    }

    /* Burbujas */
    .msg-row { display: flex; align-items: flex-end; gap: 3px; animation: fadeUp .2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .msg-row.in  { flex-direction: row; }
    .msg-row.out { flex-direction: row-reverse; }

    .bubble {
      max-width: 78%;
      padding: 6px 8px 8px;
      border-radius: 7.5px;
      font-size: 14px;
      line-height: 19px;
      color: var(--txt);
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 1px .5px rgba(0,0,0,.28);
    }
    .msg-row.in .bubble  { background: var(--bg-in); border-top-left-radius: 0; }
    .msg-row.in .bubble::before {
      content:''; position:absolute; top:0; left:-7px;
      border-width:0 7px 7px 0; border-style:solid;
      border-color: transparent var(--bg-in) transparent transparent;
    }
    .msg-row.out .bubble { background: var(--bg-out); border-top-right-radius: 0; }
    .msg-row.out .bubble::after {
      content:''; position:absolute; top:0; right:-7px;
      border-width:0 0 7px 7px; border-style:solid;
      border-color: transparent transparent transparent var(--bg-out);
    }

    .msg-meta {
      display: flex; align-items: center; gap: 3px;
      float: right; margin-left: 6px; margin-top: 2px; margin-bottom: -4px;
    }
    .msg-time { font-size: 10.5px; color: var(--txt-dim); white-space: nowrap; }
    .ticks svg { width: 15px; height: 10px; fill: var(--tick); }

    /* Typing */
    .typing-row { display: flex; margin-bottom: 2px; }
    .typing-bub {
      background: var(--bg-in);
      border-radius: 7.5px; border-top-left-radius: 0;
      padding: 11px 14px;
      display: flex; gap: 4px; align-items: center;
      box-shadow: 0 1px .5px rgba(0,0,0,.28);
      position: relative;
    }
    .typing-bub::before {
      content:''; position:absolute; top:0; left:-7px;
      border-width:0 7px 7px 0; border-style:solid;
      border-color: transparent var(--bg-in) transparent transparent;
    }
    .t-dot {
      width: 7px; height: 7px;
      background: var(--txt-dim); border-radius: 50%;
      animation: bounce 1.3s infinite;
    }
    .t-dot:nth-child(2){ animation-delay:.15s }
    .t-dot:nth-child(3){ animation-delay:.3s }
    @keyframes bounce {
      0%,60%,100%{ transform:translateY(0);opacity:.5 }
      30%{ transform:translateY(-4px);opacity:1 }
    }

    /* ══ TARJETAS ORION ══ */
    .orion-card, .match-card, .verify-card, .explain-card, .bub-inputs {
      background: var(--bg-in) !important;
      border: 0 !important;
      border-radius: 6px !important;
      box-shadow: none !important;
    }
    .orion-card, .explain-card, .bub-inputs { padding: 10px 11px !important; }
    .match-card { padding: 6px 0 !important; }
    .verify-card { padding: 3px 0 !important; }

    .orion-card  { margin-top: 6px; min-width: 220px; }
    .match-card  { margin-top: 6px; min-width: 220px; }
    .verify-card { margin-top: 6px; min-width: 220px; }
    .explain-card{ margin-top: 6px; min-width: 220px; }
    .bub-inputs  { margin-top: 6px; min-width: 220px; }

    .oc-hdr { display:flex;align-items:center;gap:6px;margin-bottom:7px; }
    .oc-logo { background:#36192a;color:#f28bb7;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:1px; }
    .oc-tag  { color:var(--txt-sub);font-size:11px; }
    .oc-name { color:var(--txt);font-weight:700;font-size:14.5px;margin-bottom:5px; }
    .oc-row  { display:flex;gap:5px;font-size:12px;color:var(--txt-sub);margin-bottom:3px; }
    .oc-row .v { color:var(--txt); }
    .oc-status { display:inline-block;margin-top:5px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600; }
    .s-nuevo      { background:#143f30;color:#7ee2aa; }
    .s-recurrente { background:#242b38;color:#aebac1; }
    .s-desertado  { background:#3a2d13;color:#f5c85b; }

    .mc-title { color:var(--txt-sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;padding:0 11px; }
    .mc-prod  { display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:5px;margin-bottom:1px;cursor:pointer;transition:background .1s; }
    .mc-prod:active { background:var(--bg-hover); }
    .mc-prod.no { opacity:.6;cursor:default; }
    .mc-pname   { color:var(--txt);font-size:13px;font-weight:500; }
    .mc-pamount { color:var(--txt-sub);font-size:11px; }

    .bub-btns { border-top:1px solid #464747;margin:8px -8px -8px;display:flex; }
    .bb-btn {
      flex:1;background:none;border:none;color:#b6d7ca;
      font-size:13px;font-weight:500;padding:10px 6px;
      cursor:pointer;font-family:var(--font);
      display:flex;align-items:center;justify-content:center;gap:4px;
    }
    .bb-btn:not(:last-child){ border-right:1px solid #464747; }
    .bb-btn:active { background:rgba(255,255,255,.05); }
    .bb-btn.red { color:#f28b82; }
    .bb-btn:first-child { border-bottom-left-radius:7.5px; }
    .bb-btn:last-child  { border-bottom-right-radius:7.5px; }

    .bi-label  { color:var(--txt-sub);font-size:11px;margin-bottom:3px;display:block; }
    .bi-input, .bi-select {
      width:100%;background:#2e2f2f;border:1px solid #464747;border-radius:6px;
      padding:7px 9px;color:var(--txt);font-size:13px;
      font-family:var(--font);outline:none;margin-bottom:8px;
      -webkit-appearance:none;
    }
    .bi-input:focus,.bi-select:focus { border-color:var(--green); }
    .bi-btn {
      width:100%;background:var(--green);color:#102016;border:none;
      border-radius:6px;padding:9px;font-size:13.5px;font-weight:600;
      cursor:pointer;font-family:var(--font);
    }
    .bi-btn:active { background:var(--green-dk); }

    .verify-card { }
    .vr-rule { display:flex;align-items:flex-start;gap:7px;padding:7px 11px;font-size:12.5px;border-bottom:1px solid #2e2f2f; }
    .vr-rule:last-child { border-bottom:none; }
    .vr-label  { color:var(--txt);line-height:1.3; }
    .vr-reason { color:var(--txt-sub);font-size:11px;margin-top:1px; }

    .explain-card { }
    .ec-sec { color:var(--txt-sub);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px; }
    .ec-row { color:var(--txt);font-size:12px;padding:3px 0;display:flex;align-items:flex-start;gap:5px; }
    .ec-step { background:#2e2f2f;color:var(--txt);border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0; }

    /* ══ INPUT BAR ══ */
    .input-bar {
      background: var(--bg-panel);
      min-height: 58px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      z-index: 10;
      border-top: 1px solid #2a2b2b;
    }

    .ib-left { display: flex; gap: 2px; }

    .ib-input {
      flex: 1;
      background: var(--bg-hover);
      border: none;
      border-radius: 22px;
      padding: 9px 14px;
      color: var(--txt);
      font-size: 15px;
      font-family: var(--font);
      outline: none;
      min-height: 42px;
      resize: none;
      line-height: 1.3;
    }
    .ib-input::placeholder { color: var(--txt-dim); }

    .ib-send {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--green);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    .ib-send:active { background: var(--green-dk); }
    .ib-send svg { width: 20px; height: 20px; fill: #fff; }

    /* ══ HOME INDICATOR (Android/iOS) ══ */
    .home-indicator {
      height: 20px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .home-bar {
      width: 120px; height: 4px;
      background: #464747;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<div class="phone-wrap">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="sb-time-os" id="os-time">9:41</span>
    <div class="sb-icons-os">
      <!-- Señal -->
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4 2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <!-- WiFi -->
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4 2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <span class="sb-battery">🔋</span>
    </div>
  </div>

  <!-- CHAT HEADER -->
  <div class="chat-header">
    <button class="ch-back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>

    <div class="ch-av">
      <img src="Logo.png" alt="ORION">
    </div>

    <div class="ch-info">
      <div class="ch-name">ORION Agente</div>
      <div class="ch-status"><span class="live-dot"></span> en línea</div>
    </div>

    <div class="ch-icons">
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- FONDO -->
  <div class="chat-bg"></div>

  <!-- MENSAJES -->
  <div class="messages" id="messages">
    <div class="date-div"><span>Hoy</span></div>
    <div class="msg-row in">
      <div class="bubble">
        👋 Hola, soy el <b>Agente ORION</b> de Caja Trujillo.<br><br>
        Estoy conectado al portal de precalificación. Cuando un cliente complete el formulario y resulte <b style="color:#21c063">APTO</b>, te notificaré aquí con todos sus datos. 🏦
        <div class="msg-meta"><span class="msg-time">08:00</span></div>
      </div>
    </div>
  </div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <button class="icon-btn">
      <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
    </button>
    <input class="ib-input" id="msg-input" type="text" placeholder="Mensaje"
      onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="icon-btn">
      <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
    </button>

    </button>
  </div>

  <!-- HOME INDICATOR -->
  <div class="home-indicator"><div class="home-bar"></div></div>

</div><!-- /phone-wrap -->

<script src="js/state.js"></script>
<script src="js/data.js"></script>
<script>
  // Reloj OS en tiempo real
  function updateOsTime() {
    const t = new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('os-time').textContent = t;
  }
  updateOsTime();
  setInterval(updateOsTime, 10000);

  // ── FLUJO ORION (idéntico al desktop) ──────────────────────────────────────
  let flow = { step:'idle', client:null, product:null, amount:0, term:0, monthly:0 };
  const box = document.getElementById('messages');

  const TICKS = `<svg viewBox="0 0 16 11" xmlns="http://www.w3.org/2000/svg" style="width:15px;height:10px;fill:#b6d7ca"><path d="M11.071.653a.75.75 0 0 0-1.06 1.06L11.071.653zm-5 9.5L5.01 11.214a.75.75 0 0 0 1.06 0L6.071 10.153zm-4-4 .011-1.061a.75.75 0 0 0-.535.214L2.071 6.153zm11-5.5 1.06 1.06a.75.75 0 0 0 0-1.06L13.071.653zm-7 9.5-1.06 1.06a.75.75 0 0 0 1.06 0L6.071 10.153zm4.5-8.44 1.06 1.06L13.131 2.773l-2.5-2.5-1.06 1.06 2.5 2.5zM6.071 9.093 3.071 6.093 1.011 8.153l3 3 2.06-2.06zm1.06 1.06L13.131 4.153l-2.12-2.12-6 6 2.12 2.12zm0 0L7.131 10.153l-1.06 1.06 1.06 1.06 1.06-1.06-1.06-1.06z"/></svg>`;

  function hhmm() { return new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}); }

  function addMsg(html, dir='in', delay=0) {
    return new Promise(res => setTimeout(() => {
      const row = document.createElement('div');
      row.className = `msg-row ${dir}`;
      const meta = `<div class="msg-meta"><span class="msg-time">${hhmm()}</span>${dir==='out'?`<span class="ticks">${TICKS}</span>`:''}</div>`;
      row.innerHTML = `<div class="bubble">${html}${meta}</div>`;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
      res();
    }, delay));
  }

  function showTyping(ms=1400) {
    return new Promise(res => {
      const row = document.createElement('div');
      row.className='typing-row'; row.id='typing';
      row.innerHTML=`<div class="typing-bub"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div>`;
      box.appendChild(row); box.scrollTop=box.scrollHeight;
      setTimeout(()=>{ row.remove(); res(); }, ms);
    });
  }

  async function onNewClient(notif) {
    flow = { ...flow, step:'notified', client:notif };
    await showTyping(1600);
    await addMsg(`🔔 *Nuevo cliente APTO* en el portal de precalificación.`);
    await showTyping(900);
    const sc = {nuevo:'s-nuevo',recurrente:'s-recurrente',desertado:'s-desertado'}[notif.status]||'s-nuevo';
    await addMsg(`
      <div class="orion-card">
        <div class="oc-hdr"><span class="oc-logo">ORION</span><span class="oc-tag">Check — Precalificación ✅</span></div>
        <div class="oc-name">👤 ${notif.clientName}</div>
        <div class="oc-row">📄 DNI: <span class="v">${notif.dni}</span></div>
        <div class="oc-row">💳 Crédito: <span class="v">${notif.creditType}</span></div>
        <div class="oc-row">📍 Agencia: <span class="v">${notif.agency}</span></div>
        <div class="oc-row">🕐 Hace: <span class="v">unos segundos</span></div>
        <span class="oc-status ${sc}">${notif.status}</span>
      </div>
      <div class="bub-btns">
        <button class="bb-btn" onclick="doMatch()">🎯 Ver productos</button>
        <button class="bb-btn red" onclick="addMsg('Ignorado.','out')">Ignorar</button>
      </div>
    `);
  }

  // Genera alias genérico por tipo: "Crédito Consumo 1", "Crédito Hipotecario 1", etc.
  function buildAliases(products) {
    const counters = {};
    return products.map(p => {
      const tipo = p.creditTypes[0] || 'Producto';
      counters[tipo] = (counters[tipo] || 0) + 1;
      return { ...p, alias: `Crédito ${tipo} ${counters[tipo]}` };
    });
  }

  async function doMatch() {
    await addMsg('Ver productos disponibles 🎯','out');
    await showTyping(1400);
    const found = DATA.clients.find(x=>x.dni===flow.client.dni);
    const c = found ? {...found} : {...flow.client, name: flow.client.clientName||flow.client.name||'Cliente', creditScore:680, income:3500, debt:300, age:30};
    c.creditType = flow.client.creditType; flow.client=c; State.set({client:c});
    // Forzar todos los productos como Consumo para el match
    const productsNormalized = DATA.products.map(p=>({...p, creditTypes:['Consumo']}));
    const productsWithAlias = buildAliases(productsNormalized);
    const results = productsWithAlias.map((p,i)=>({...p,ok:i<2}));
    // Guarda el mapa id→alias para usarlo en pasos siguientes
    flow.aliasMap = {};
    productsWithAlias.forEach(p => { flow.aliasMap[p.id] = p.alias; });
    const nOk = results.filter(r=>r.ok).length;
    await addMsg(`
      Productos evaluados para <b>${c.name}</b>:
      <div class="match-card">
        <div class="mc-title">ORION Match — ${nOk} disponible(s)</div>
        ${results.map(r=>`
          <div class="mc-prod ${r.ok?'ok':'no'}" ${r.ok?`onclick="doSelectProduct('${r.id}')"`:''}">
            <span>${r.ok?'✅':'❌'}</span>
            <div><div class="mc-pname">${r.alias}</div><div class="mc-pamount">Hasta S/ ${r.maxAmount.toLocaleString()}</div></div>
            ${r.ok?'<span style="color:#21c063;font-size:11px;margin-left:auto;">›</span>':''}
          </div>`).join('')}
      </div>
    `);
    flow.step='match';
  }

  async function doSelectProduct(id) {
    const p=DATA.products.find(x=>x.id===id); flow.product=p; State.set({selectedProduct:p});
    const alias = (flow.aliasMap && flow.aliasMap[id]) || p.name;
    flow.productAlias = alias;
    await addMsg(`✅ Seleccionado: <b>${alias}</b>`,'out');
    await showTyping(1000);
    await addMsg(`
      Ingresa los parámetros de la operación:
      <div class="bub-inputs">
        <label class="bi-label">Monto solicitado (S/)</label>
        <input class="bi-input" id="wsp-amount" type="number" inputmode="numeric" placeholder="Ej: 15000" min="100" max="${p.maxAmount}">
        <label class="bi-label">Plazo</label>
        <select class="bi-select" id="wsp-term">
          <option value="">Selecciona plazo</option>
          ${p.terms.map(t=>`<option value="${t}">${t} meses</option>`).join('')}
        </select>
        <button class="bi-btn" onclick="doVerify()">Evaluar condiciones →</button>
      </div>
    `);
    flow.step='verify';
  }

  async function doVerify() {
    const amount=parseFloat(document.getElementById('wsp-amount')?.value);
    const term=parseInt(document.getElementById('wsp-term')?.value);
    if(!amount||!term){alert('Completa monto y plazo.');return;}
    const c=flow.client,p=flow.product;
    await addMsg(`Monto: S/ ${amount.toLocaleString()} · Plazo: ${term} meses`,'out');
    await showTyping(1700);
    const rules=[
      {l:'Monto dentro del límite',ok:amount<=p.maxAmount},
      {l:'Plazo válido',ok:p.terms.includes(term)},
      {l:'Evaluación crediticia',ok:true},
      {l:'Condiciones del producto',ok:true},
    ];
    const monthly=(amount*.018/(1-Math.pow(1.018,-term))).toFixed(2);
    flow={...flow,amount,term,monthly,step:'verified'};
    State.set({verifyParams:{amount,term},approved:true});
    await addMsg(`
      <b>ORION Verify</b> — resultado:
      <div class="verify-card">
        ${rules.map(r=>`
          <div class="vr-rule">
            <span>${r.ok?'✅':'❌'}</span>
            <div><div class="vr-label">${r.l}</div></div>
          </div>`).join('')}
      </div>
      <div style="margin-top:8px;font-size:12.5px;">
        <span style="color:#21c063">✅ <b>Viable</b> — Cuota ref. S/ ${parseFloat(monthly).toLocaleString()}/mes</span>
      </div>
      <div class="bub-btns">
        <button class="bb-btn" onclick="doExplain()">📋 Guía operativa</button>
      </div>
    `);
  }

  function _getRatio(p){
    if(p.id==='p2') return {val:'30%',sub:'Máx. para hipotecario'};
    if(p.id==='p3') return {val:'40%',sub:'Máx. para MYPE'};
    return {val:'35%',sub:'Máx. para consumo'};
  }
  function _getGarantia(p,amt){
    if(p.id==='p2') return {val:'Hipotecaria',sub:'Obligatoria'};
    if(p.id==='p3'&&amt>=50000) return {val:'Real o mobiliaria',sub:'Desde S/ 50,000'};
    if(p.id==='p3') return {val:'No requerida',sub:''};
    return {val:'No requerida',sub:''};
  }
  function _getSeguros(p){
    if(p.id==='p2') return 'Desgravamen + bien inmueble';
    return 'Desgravamen';
  }
  function _getAval(c,p){
    if(p.id==='p2') return {val:'No aplica',sub:'Garantía hipotecaria'};
    if(c.status==='nuevo') return {val:'Requerido',sub:'Cliente nuevo'};
    return {val:'No requerido',sub:'Cliente recurrente'};
  }
  function _getDestino(p){
    if(p.id==='p1') return 'Consumo libre';
    if(p.id==='p2') return 'Adquisición / construcción de vivienda';
    if(p.id==='p3') return 'Capital de trabajo / activo fijo';
    return 'Consumo personal';
  }
  function _getAprobador(p,amt){
    return { chain:['Administrador'], idx:0 };
  }
  function _getDocs(c,p,amt){
    const groups=[];
    if(c.status==='nuevo'){
      const docs=[];
      if(p.id==='p1'||p.id==='p4'){ docs.push('📄 Boletas de pago últimos 3 meses'); docs.push('📄 Recibo de servicios'); }
      else if(p.id==='p3'){ docs.push('📄 Declaración jurada de ingresos'); docs.push('📄 Estados de cuenta últimos 6 meses'); docs.push('📄 Boletas/facturas (si aplica)'); }
      else if(p.id==='p2'){ docs.push('📄 Boletas o declaración de renta'); docs.push('📄 Estados de cuenta últimos 6 meses'); }
      groups.push({head:'Ingresos — cliente nuevo',docs});
    }
    if(p.id==='p2') groups.push({head:'Garantía hipotecaria',docs:['📄 Partida registral (SUNARP)','📄 Tasación vigente (≤6 meses)','📄 HR y PU vigente']});
    if(p.id==='p3'&&amt>=50000) groups.push({head:'Garantía ≥ S/ 50,000',docs:['📄 Documento del bien','📄 Tasación o valorización']});
    if(c.status==='nuevo'&&p.id!=='p2') groups.push({head:'Aval',docs:['📄 DNI del aval','📄 Sustento de ingresos del aval']});
    if(p.id==='p3') groups.push({head:'Documentación empresarial',docs:['📄 RUC activo y ficha actualizada','📄 Declaración anual SUNAT','📄 EE.FF. firmados por contador']});
    const segDocs=['📄 Seguro de desgravamen'];
    if(p.id==='p2') segDocs.push('📄 Póliza del bien inmueble');
    groups.push({head:'Seguros',docs:segDocs});
    const destDocs=[];
    if(p.id==='p3') destDocs.push('📄 Proformas o cotizaciones');
    if(amt>=75000) destDocs.push('📄 Declaración de origen de fondos (PLAFT)');
    if(destDocs.length) groups.push({head:'Destino del crédito',docs:destDocs});
    return groups;
  }

  async function doExplain() {
    const {client:c,product:p,amount,term,monthly}=flow;
    await addMsg('Ver guía operativa 📋','out');
    await showTyping(1200);
    const ratio=_getRatio(p), garantia=_getGarantia(p,amount), seguros=_getSeguros(p);
    const aval=_getAval(c,p), destino=_getDestino(p), aprov=_getAprobador(p,amount), docs=_getDocs(c,p,amount);
    const chainHtml = aprov.chain.map((s,i)=>
      `<span style="font-size:10px;padding:2px 6px;border-radius:10px;border:1px solid #464747;color:${i===aprov.idx?'#102016':'#aebac1'};background:${i===aprov.idx?'#21c063':'transparent'};font-weight:${i===aprov.idx?'700':'400'}">${s}</span>${i<aprov.chain.length-1?'<span style="color:#8696a0;font-size:10px"> › </span>':''}`
    ).join('');
    const docsHtml = docs.map(g=>`
      <div style="color:#8696a0;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px;">${g.head}</div>
      ${g.docs.map(d=>`<div class="ec-row">${d}</div>`).join('')}
    `).join('');
    await addMsg(`
      <div class="explain-card">
        <div class="oc-hdr"><span class="oc-logo">ORION</span><span class="oc-tag">Explain — Guía operativa</span></div>
        <div class="oc-row">📦 <span class="v">${flow.productAlias || p.name}</span></div>
        <div class="oc-row">💰 <span class="v">S/ ${parseFloat(amount).toLocaleString()} · ${term} meses · S/ ${parseFloat(monthly).toLocaleString()}/mes</span></div>
        <div class="ec-sec">🛡️ Nivel de aprobación</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px;">${chainHtml}</div>
        <div class="ec-sec">📊 Condiciones</div>
        <div class="ec-row">📈 Ratio cuota/ingreso: <span class="v" style="margin-left:4px">${ratio.val}</span></div>
        <div class="ec-row">🏠 Garantía: <span class="v" style="margin-left:4px">${garantia.val}</span></div>
        <div class="ec-row">🛡 Seguros: <span class="v" style="margin-left:4px">${seguros}</span></div>
        <div class="ec-row">👤 Aval: <span class="v" style="margin-left:4px">${aval.val}</span></div>
        <div class="ec-row">🎯 Destino: <span class="v" style="margin-left:4px">${destino}</span></div>
        <div class="ec-sec">📎 Documentación</div>
        ${docsHtml}

      </div>
      <div class="bub-btns">
        <button class="bb-btn" onclick="doFinish()">✅ Finalizar</button>
      </div>
    `);
  }

  async function doFinish() {
    await addMsg('Operación finalizada ✅','out');
    await showTyping(700);
    await addMsg(`¡Listo! 🎉 La operación de <b>${flow.client.name}</b> fue procesada. Puedes atender al siguiente cliente.`);
    flow={step:'idle',client:null,product:null,amount:0,term:0,monthly:0,aliasMap:{},productAlias:''};
  }

  async function sendMsg() {
    const inp=document.getElementById('msg-input');
    const txt=inp.value.trim(); if(!txt)return;
    inp.value='';
    await addMsg(txt,'out');
    await showTyping(900);
    const l=txt.toLowerCase();
    if(l.includes('hola')||l.includes('buenas')) return addMsg('¡Hola! 👋 Listo para notificarte cuando llegue un cliente.');
    if(l.includes('cliente')||l.includes('nuevo')) return addMsg('Sin nuevos ingresos por ahora. Te aviso en cuanto llegue uno. 🔔');
    if(l.includes('ayuda')||l.includes('help')) return addMsg('Puedo notificarte sobre clientes APTOS y guiarte por el flujo crediticio. 🤖');
    addMsg('Entendido 👁 Sigo monitoreando el portal.');
  }

  window.addEventListener('storage', e => {
    if(e.key==='orion_new_notif'&&e.newValue){
      const notif=JSON.parse(e.newValue);
      localStorage.removeItem('orion_new_notif');
      onNewClient(notif);
    }
  });
</script>
